<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Rebuild – Power Module</title>
<link rel="stylesheet" href="../shared/rebuild-shell.css">
<link rel="stylesheet" href="../shared/game-fonts.css">
<script vite-ignore src="../shared/rebuild-telemetry.js"></script>
<script vite-ignore src="../shared/rebuild-notebook.js"></script>
<script vite-ignore defer src="../shared/rebuild-shell.js"></script>
<style>
:root{--ink:#2b2118;--cream:#fff8ea;--cream2:#f6e6c4;--wood:#7a4e2d;--wood2:#5a3720;--green:#4fa52f;--green2:#2f6e1c;--blue:#2a7fc0;--blue2:#185a8c;--red:#c8502f;--gold:#f2c14e;
--u:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2430;font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:calc(18px*var(--u))}
#ui button{pointer-events:auto;font-family:inherit}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.panel{background:linear-gradient(180deg,var(--cream),var(--cream2));border:calc(4px*var(--u)) solid var(--wood);border-radius:calc(20px*var(--u));box-shadow:inset 0 calc(-5px*var(--u)) 0 rgba(122,78,45,.18),inset 0 2px 0 #fff,0 calc(10px*var(--u)) calc(26px*var(--u)) rgba(20,12,4,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:none;cursor:pointer;font-family:Fredoka,Nunito,sans-serif!important;font-weight:600;font-size:1.15em;color:#fff;padding:.62em 1.3em;border-radius:999px;background:linear-gradient(180deg,#6cc544,var(--green));border-bottom:calc(6px*var(--u)) solid var(--green2);text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 calc(8px*var(--u)) calc(18px*var(--u)) rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,border-width .08s,filter .2s;position:relative;overflow:hidden;min-height:44px}
.btn:active,.btn.down{transform:translateY(3px);border-bottom-width:calc(3px*var(--u))}
.btn:disabled{filter:grayscale(.8) brightness(.85);cursor:default}
.btn.blue{background:linear-gradient(180deg,#4aa3e0,var(--blue));border-bottom-color:var(--blue2)}
.btn.orange{background:linear-gradient(180deg,#f08a4b,#d7632b);border-bottom-color:#9a3f17}
.btn.brown{background:linear-gradient(180deg,#a8754a,var(--wood));border-bottom-color:var(--wood2)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#f0b43a);border-bottom-color:#b07a14;color:#3a2610;text-shadow:none}
.btn.red{background:linear-gradient(180deg,#e0663e,var(--red));border-bottom-color:#8f3317}
.btn.ghost{background:rgba(255,248,234,.92);color:var(--wood2);border-bottom-color:#c9ae84;text-shadow:none}
.btn.big{font-size:1.75em;padding:.55em 1.6em}
.btn.small{font-size:.95em;padding:.45em 1em}
.btn .fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(255,255,255,.22);pointer-events:none}
.ibtn{width:calc(54px*var(--u));height:calc(54px*var(--u));min-width:44px;min-height:44px;border-radius:calc(16px*var(--u));border:calc(4px*var(--u)) solid var(--wood);background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:1.25em}
.ibtn:active{transform:translateY(2px)}

/* title */
.screen{position:absolute;inset:0;pointer-events:auto;transition:opacity .6s}
.screen.out{opacity:0;pointer-events:none}
.title{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,26,40,.15) 0%,rgba(20,26,40,.78) 100%)}
.title-inner{display:flex;flex-direction:column;align-items:center;gap:calc(14px*var(--u));text-align:center;padding:20px}
.logo{display:flex;gap:.02em;font-family:Fredoka,sans-serif;font-weight:700;font-size:calc(118px*var(--u));line-height:1;letter-spacing:.02em}
.logo span{display:inline-block;color:#ffd65c;-webkit-text-stroke:calc(5px*var(--u)) #6b2a12;paint-order:stroke fill;text-shadow:0 calc(8px*var(--u)) 0 #6b2a12,0 calc(16px*var(--u)) calc(30px*var(--u)) rgba(0,0,0,.5);animation:bob 2.6s ease-in-out infinite}
.logo span:nth-child(2n){color:#ffb347}
.logo span:nth-child(1){animation-delay:0s}.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}.logo span:nth-child(5){animation-delay:.48s}.logo span:nth-child(6){animation-delay:.6s}.logo span:nth-child(7){animation-delay:.72s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(calc(-8px*var(--u))) rotate(1.5deg)}}
.tagline{margin:0;color:#fff;font-weight:900;font-size:1.35em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.loadbar{width:calc(440px*var(--u));max-width:80vw;height:calc(18px*var(--u));border-radius:99px;background:rgba(0,0,0,.35);border:3px solid var(--cream);overflow:hidden;margin-top:calc(16px*var(--u))}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd65c,#ffb347);transition:width .3s}
.loadtxt{margin:0;color:#fff;font-weight:800;font-size:.9em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.title .start{opacity:0;transform:scale(.9);transition:all .4s}
.title.ready .start{opacity:1;transform:scale(1);animation:pulse 1.6s ease-in-out infinite}
.title.ready .loadbar,.title.ready .loadtxt{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,92,.6),0 10px 24px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 calc(14px*var(--u)) rgba(255,214,92,0),0 10px 24px rgba(0,0,0,.3)}}
.hint{margin:0;display:flex;align-items:center;gap:.4em;color:#fff;font-weight:800;font-size:.85em;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chips{position:absolute;top:calc(18px*var(--u));left:calc(18px*var(--u));display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:rgba(255,248,234,.92);color:var(--ink);font-weight:900;font-size:.75em;padding:.45em .9em;border-radius:99px}

/* hud */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(14px*var(--u)) calc(16px*var(--u));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;opacity:0;transform:translateY(-20px);transition:all .5s}
.hud.on{opacity:1;transform:none}
.hud .right{display:flex;gap:calc(10px*var(--u))}
.hud .progress{display:flex;align-items:center;gap:.6em;padding:.45em .9em;font-family:Fredoka,sans-serif;font-size:1em;pointer-events:none;transition:opacity .3s}
.hud .progress.off{display:none}
.hud .progress b{font-weight:600}
.segs{display:flex;gap:4px}
.segs i{width:calc(28px*var(--u));height:calc(12px*var(--u));border-radius:6px;background:#dccdb0;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.segs i.on{background:linear-gradient(180deg,#ffd76a,var(--gold));box-shadow:0 0 8px rgba(242,193,78,.9)}
.hud .steps{display:none;gap:.35em;padding:.35em .5em;flex-wrap:wrap;justify-content:center}
.hud .steps.on{display:flex}
.steps span{display:inline-flex;align-items:center;gap:.3em;font-weight:900;font-size:.8em;padding:.32em .75em;border-radius:99px;background:#e9dcc3;color:#7a6650}
.steps span em{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;background:#cdbb9b;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
.steps span.done{background:#d8ecc9;color:#2f5a1c}
.steps span.cur{background:linear-gradient(180deg,#4aa3e0,var(--blue));color:#fff;box-shadow:0 0 0 3px var(--gold)}
.steps span.cur em{background:rgba(255,255,255,.3)}

/* markers */
.markers{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.markers.on{opacity:1}
.markers.on .marker{pointer-events:auto}
.marker{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;cursor:pointer;transform:translate(-50%,-100%);pointer-events:none;will-change:transform}
.marker .disc{position:relative;width:calc(64px*var(--u));height:calc(64px*var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6em;border:calc(4px*var(--u)) solid #fff;background:#857a6c;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.marker .badge{position:absolute;right:-8px;bottom:-6px;width:calc(28px*var(--u));height:calc(28px*var(--u));border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:.55em;border:2px solid #fff}
.marker .lbl{background:rgba(43,33,24,.82);color:#fff7e8;font-weight:900;font-size:.72em;padding:.3em .8em;border-radius:99px;white-space:nowrap}
.marker.open .disc{background:linear-gradient(180deg,#ffd76a,#f0a93a);color:#5a3200;width:calc(80px*var(--u));height:calc(80px*var(--u));font-size:2em;animation:mpulse 1.5s ease-in-out infinite}
.marker.open .badge{display:none}
.marker.open .lbl{background:#d7632b;font-size:.85em;border:2px solid #fff}
.marker.done .disc{background:linear-gradient(180deg,#6cc544,var(--green))}
.marker.done .badge{background:var(--green2)}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,92,.75),0 8px 18px rgba(0,0,0,.35);transform:translateY(0)}50%{box-shadow:0 0 0 calc(16px*var(--u)) rgba(255,214,92,0),0 8px 18px rgba(0,0,0,.35);transform:translateY(-6px)}}

/* dialogue */
.dialogue{position:absolute;left:50%;bottom:calc(16px*var(--u));width:min(calc(880px*var(--u)),calc(100% - 24px));transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:flex-end;pointer-events:none}
.dialogue.on{transform:translate(-50%,0);pointer-events:auto}
.dialogue .portrait{width:calc(118px*var(--u));height:calc(118px*var(--u));border-radius:50%;border:calc(5px*var(--u)) solid var(--wood);background:var(--gold);overflow:hidden;flex-shrink:0;margin-right:calc(-26px*var(--u));z-index:1;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.dialogue .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.dialogue .box{flex:1;padding:calc(16px*var(--u)) calc(22px*var(--u)) calc(16px*var(--u)) calc(44px*var(--u));position:relative;min-height:calc(96px*var(--u))}
.dialogue .name{position:absolute;top:calc(-16px*var(--u));left:calc(40px*var(--u));background:linear-gradient(180deg,#e0663e,var(--red));color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:.9em;padding:.2em .9em;border-radius:10px;border:3px solid var(--wood)}
.dialogue .txt{margin:.3em 0 0;font-weight:800;font-size:1.12em;line-height:1.38}
.dialogue .more{position:absolute;right:calc(18px*var(--u));bottom:calc(8px*var(--u));font-weight:900;font-size:.75em;color:#8a6a4a;opacity:0}
.dialogue.wait .more{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* actions */
.actions{position:absolute;right:calc(18px*var(--u));bottom:calc(150px*var(--u));display:flex;flex-direction:column;align-items:flex-end;gap:calc(12px*var(--u))}
.actions .btn{font-size:1.05em}

/* toasts */
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(84px*var(--u));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.toast{display:flex;gap:.7em;align-items:center;padding:.6em 1em;max-width:calc(380px*var(--u));animation:tin .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{transition:all .5s;opacity:0;transform:translateY(-20px)}
.toast .ticon{width:2.2em;height:2.2em;border-radius:12px;background:linear-gradient(180deg,#ffd76a,var(--gold));color:#6b4a00;display:flex;align-items:center;justify-content:center;font-size:1em;flex-shrink:0}
.toast small{display:block;font-weight:900;font-size:.65em;letter-spacing:.06em;color:#b07a14;text-transform:uppercase}
.toast b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.05em}
.toast p{margin:.1em 0 0;font-size:.78em;font-weight:700;color:#5c4a3a}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}}

/* modal */
.modal{position:absolute;inset:0;background:rgba(20,14,8,.5);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .25s;padding:16px}
.modal.out{opacity:0;transition:opacity .25s}
.modal .card{padding:calc(22px*var(--u)) calc(26px*var(--u));max-width:min(calc(640px*var(--u)),94vw);max-height:88vh;overflow:auto;text-align:center}
.modal h2{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 .4em;display:flex;align-items:center;justify-content:center;gap:.4em;font-size:1.5em}
.modal p{font-weight:800;line-height:1.4}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1em}
.modal .pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.modal .page{background:#fff;border:2px solid #e3d3b5;border-radius:14px;padding:.6em .8em}
.modal .page b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--blue2)}
.modal .page p{margin:.2em 0 0;font-size:.85em}
.modal .stars{display:flex;justify-content:center;gap:.2em;font-size:3em;color:var(--gold)}
.modal .stars .ic{fill:var(--gold);stroke:#b07a14;stroke-width:1.2}
.modal .stars .ic.off{fill:#ddd0b8;stroke:#b9a684}
@keyframes fin{from{opacity:0}}

/* predict + confidence */
.opts{display:flex;flex-direction:column;gap:10px;text-align:left;margin:.4em 0}
.opt{display:flex;align-items:center;gap:.6em;padding:.6em .9em;border-radius:14px;border:3px solid #e3d3b5;background:#fff;font-weight:800;cursor:pointer;transition:all .15s}
.opt .dot{width:1.3em;height:1.3em;border-radius:50%;border:3px solid #c9b48c;flex-shrink:0}
.opt.sel{border-color:var(--blue);background:#eaf4fd}
.opt.sel .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.conf{margin-top:.6em}
.conf small{font-weight:900;font-size:.72em;letter-spacing:.06em;color:#8a6a4a;text-transform:uppercase}
.conf .cbtns{display:flex;gap:8px;justify-content:center;margin-top:.4em;flex-wrap:wrap}
.cbtn{padding:.45em .9em;border-radius:99px;border:3px solid #e3d3b5;background:#fff;font-weight:900;font-size:.82em;cursor:pointer;color:#7a6650}
.cbtn.sel{border-color:var(--gold);background:#fff4d8;color:#8a5a00}

/* gear card */
.gear{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:.5em 0 .2em}
.gear .g{width:calc(130px*var(--u));background:#fff;border:3px solid #e3d3b5;border-radius:16px;padding:.7em .5em;display:flex;flex-direction:column;align-items:center;gap:.3em}
.gear .g .em{font-size:2.4em;line-height:1}
.gear .g b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1em;color:var(--wood2)}
.gear .g small{font-size:.72em;font-weight:800;color:#6a5a48}
.warnrow{display:flex;align-items:center;justify-content:center;gap:.5em;background:#fff4d8;border:3px solid var(--gold);border-radius:14px;padding:.5em .8em;margin:.3em 0;font-weight:900;color:#8a5a00;font-size:.92em}

/* two current counters */
.counters{position:absolute;left:50%;top:calc(90px*var(--u));transform:translate(-50%,-10px);display:flex;gap:16px;opacity:0;transition:all .4s;z-index:3}
.counters.on{opacity:1;transform:translate(-50%,0)}
.counter{padding:.45em 1em;text-align:center;min-width:calc(110px*var(--u))}
.counter small{display:block;font-weight:900;font-size:.62em;letter-spacing:.08em;color:#8a6a4a;text-transform:uppercase}
.counter b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.7em;color:var(--blue2);display:block}
.counter.inn b{color:var(--green2)}
.counter.out b{color:var(--red)}
.counter .eq{display:flex;align-items:center;font-family:Fredoka,sans-serif;font-size:2em;color:var(--wood)}

/* station overlay (puzzle panels) */
.station{position:absolute;inset:0;background:rgba(20,14,8,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:14px;animation:fin .25s}
.station .wrap{width:min(calc(760px*var(--u)),96vw);max-height:92vh;overflow:auto;padding:calc(18px*var(--u)) calc(20px*var(--u));text-align:center}
.station h3{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 .2em;font-size:1.35em;display:flex;align-items:center;justify-content:center;gap:.35em}
.station .sub{margin:0 0 .5em;font-weight:800;font-size:.92em;color:#5c4a3a}
.station .svgbox{background:#fbf3df;border:3px solid #e3d3b5;border-radius:16px;padding:8px;margin:.4em auto;max-width:100%}
.station .svgbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.station .brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:.6em}
.msg{min-height:1.4em;font-weight:900;font-size:.9em;margin:.3em 0 0}
.msg.ok{color:var(--green2)}
.msg.bad{color:var(--red)}

/* sort puzzle */
.baskets{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.basket{flex:1;min-width:calc(150px*var(--u));background:#fff;border:3px dashed #c9b48c;border-radius:16px;padding:.5em;min-height:calc(120px*var(--u))}
.basket.will{border-color:var(--green);background:#f0faea}
.basket.wont{border-color:#b08968;background:#f7f0e8}
.basket .bt{font-family:Fredoka,sans-serif;font-weight:600;font-size:.95em;margin-bottom:.3em;display:flex;align-items:center;justify-content:center;gap:.3em}
.basket.will .bt{color:var(--green2)}
.basket.wont .bt{color:var(--wood2)}
.bitems{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:calc(74px*var(--u))}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:.4em 0;padding:.4em;background:#fbf3df;border:3px solid #e3d3b5;border-radius:16px;min-height:calc(80px*var(--u))}
.obj{width:calc(84px*var(--u));padding:.4em .2em;background:#fff;border:3px solid #e3d3b5;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:.1em;cursor:pointer;font-weight:900;font-size:.72em;color:#5c4a3a;transition:transform .15s,border-color .2s;position:relative}
.obj:active{transform:scale(.94)}
.obj .em{font-size:1.8em;line-height:1.1}
.obj.lit{border-color:var(--gold);box-shadow:0 0 0 3px #fff4d8,0 0 16px rgba(242,193,78,.8)}
.obj.flag{animation:shake .4s}
.obj .fl{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border-radius:50%;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;font-size:.9em;border:2px solid #fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.fade{position:absolute;inset:0;opacity:0;transition:opacity .6s;pointer-events:none}
.fade.on{opacity:1}
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){
  #rotate{display:flex;position:fixed;inset:0;z-index:99;background:#2b2118;color:#fff8ea;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Fredoka,sans-serif;font-size:22px;text-align:center;padding:30px}
  #rotate svg{width:90px;height:90px;animation:rot 2s ease-in-out infinite}
}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (max-height:460px){.dialogue .portrait{width:78px;height:78px}.actions{bottom:118px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#fff8ea" stroke-width="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg><div>Please rotate your device to landscape</div></div>
<script type="module">
import * as THREE from 'three';

/* ========================= helpers ========================= */
const A=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* icons */
const ICONS={
 play:'<path d="M7 5l12 7-12 7z"/>',
 sound:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/><path d="M18.5 7a7 7 0 010 10"/>',

/* ========================= audio ========================= */
function makeAudio(){
 let ac=null,master=null,muted=false,ambient=null;
 const ensure=()=>{if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);}};
 const noiseBuf=()=>{ensure();const b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};
 let NB=null;
 const tone=(f,t,dur,type='sine',vol=.3,slideTo)=>{if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);};
 const noise=(t,dur,vol=.3,hp=800)=>{if(muted||!ac)return;if(!NB)NB=noiseBuf();const s=ac.createBufferSource();s.buffer=NB;const g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);};
 const api={
  get muted(){return muted;},
  setMuted(m){muted=m;if(master)master.gain.value=m?0:.5;},
  unlock(){ensure();if(ac.state==='suspended')ac.resume();},
  play(name){if(muted)return;ensure();const t=ac.currentTime;switch(name){
   case'tap':tone(420,t,.08,'triangle',.25,620);break;
   case'type':tone(900,t,.025,'square',.05);break;
   case'page':noise(t,.18,.14,1200);tone(300,t,.12,'sine',.1);break;
   case'spark':noise(t,.22,.4,2000);tone(140,t,.18,'sawtooth',.18,70);break;
   case'zap':noise(t,.12,.3,3000);tone(1200,t,.1,'square',.12,300);break;
   case'bulbon':tone(660,t,.5,'sine',.22,990);tone(990,t+.04,.5,'sine',.14,1320);break;
   case'good':[523,659,784].forEach((f,i)=>tone(f,t+i*.08,.3,'triangle',.22));break;
   case'win':[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.1,.5,'triangle',.22));noise(t,.3,.1,1500);break;
   case'error':tone(200,t,.25,'sawtooth',.2,120);break;
   case'pop':tone(520,t,.12,'sine',.2,780);break;
  }},
  startAmbient(){ensure();if(ambient||muted)return;ambient=ac.createGain();ambient.gain.value=.03;ambient.connect(master);const o=ac.createOscillator();o.type='sine';o.frequency.value=70;const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.15;lg.gain.value=18;lfo.connect(lg);lg.connect(o.frequency);o.connect(ambient);o.start();lfo.start();}
 };
 return api;
}

  const confirmBtn=A('button','btn','<span>Confirm prediction</span>');confirmBtn.disabled=true;

  m.querySelectorAll('.cbtn').forEach(c=>c.addEventListener('click',()=>{audio.play('pop');m.querySelectorAll('.cbtn').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false');});c.classList.add('sel');c.setAttribute('aria-pressed','true');conf=+c.dataset.c;telemetry.confidence(conf+1);upd();}));

function brickTexture(){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 x.fillStyle='#5f2619';x.fillRect(0,0,256,256);// deep mortar
 const bh=30,bw=60;let row=0;
 for(let y=0;y<256;y+=bh){const off=(row%2)*bw/2;
  for(let bx=-bw;bx<256;bx+=bw){const r=Math.random();const rr=148+r*46,gg=56+r*30,bb=42+r*22;
   const gx=x.createLinearGradient(bx+off,y,bx+off,y+bh);
   gx.addColorStop(0,`rgb(${Math.min(255,rr+16)|0},${gg+11|0},${bb+8|0})`);gx.addColorStop(1,`rgb(${rr-13|0},${gg-9|0},${bb-6|0})`);
   x.fillStyle=gx;x.fillRect(bx+off+2,y+2.5,bw-4,bh-5);
   for(let s=0;s<9;s++){x.fillStyle=`rgba(${30+Math.random()*60|0},20,12,${Math.random()*.22})`;x.fillRect(bx+off+2+Math.random()*(bw-6),y+3+Math.random()*(bh-7),2,2);}
  }row++;}
 x.strokeStyle='rgba(36,14,9,.62)';x.lineWidth=3;row=0;
 for(let y=0;y<256;y+=bh){x.beginPath();x.moveTo(0,y+1);x.lineTo(256,y+1);x.stroke();const off=(row%2)*bw/2;for(let bx=-bw;bx<256;bx+=bw){x.beginPath();x.moveTo(bx+off,y);x.lineTo(bx+off,y+bh);x.stroke();}row++;}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}
function slateTexture(){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 x.fillStyle='#39434e';x.fillRect(0,0,256,256);
 const sh=24,sw=36;let row=0;
 for(let y=0;y<256;y+=sh){const off=(row%2)*sw/2;
  for(let sx=-sw;sx<256;sx+=sw){const r=Math.random()*30|0;
   const gx=x.createLinearGradient(0,y,0,y+sh);gx.addColorStop(0,`rgb(${74+r},${86+r},${100+r})`);gx.addColorStop(1,`rgb(${48+r},${58+r},${70+r})`);
   x.fillStyle=gx;x.beginPath();x.moveTo(sx+off,y);x.lineTo(sx+off+sw,y);x.lineTo(sx+off+sw-3,y+sh-2);x.lineTo(sx+off+3,y+sh-2);x.closePath();x.fill();
   x.strokeStyle='rgba(18,24,32,.5)';x.lineWidth=1.4;x.stroke();
   x.strokeStyle='rgba(200,215,230,.2)';x.lineWidth=1;x.beginPath();x.moveTo(sx+off+3,y+1.5);x.lineTo(sx+off+sw-3,y+1.5);x.stroke();
  }row++;}

 let rioState='walkin',rioCheerT=0;
 function updateRio(dt){
  rio.update(dt);
  const p=rio.root.position;rioLight.position.set(p.x+1.2,3,p.z+1.5);
  if(rioCheerT>0){rioCheerT-=dt;rio.setMode('cheer');if(rioCheerT<=0)rioState='idle';return;}
  if(rioState==='walkin'){
   rio.setMode('walk');
   const d=new THREE.Vector3().subVectors(RIO_HOME,p);d.y=0;const dist=d.length();
   if(dist<0.1){rioState='idle';}
   else{d.normalize();p.addScaledVector(d,Math.min(dist,dt*2.4));rio.root.rotation.y=Math.atan2(d.x,d.z);}
  }else{
   rio.setMode('idle');
   const tgt=1.02;rio.root.rotation.y+=(tgt-rio.root.rotation.y)*Math.min(1,dt*3);
  }
 }

 // ---- hands-on: reconnect the power-line junctions ----
 const connectors=[],sparks=[];let connectorsLive=false;const rcC=new THREE.Raycaster();
 function makeConnector(x,y,z){
  const orbMat=new THREE.MeshStandardMaterial({color:'#4a3320',emissive:'#ffcf3f',emissiveIntensity:0,metalness:.3,roughness:.5});
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),orbMat);orb.position.set(x,y,z);g.add(orb);
  const box=new THREE.Mesh(new THREE.BoxGeometry(.34,.34,.34),new THREE.MeshStandardMaterial({color:'#2e7d32',emissive:'#5fd56a',emissiveIntensity:0}));
  box.position.set(x,y,z);box.visible=false;g.add(box);
  connectors.push({orb,orbMat,box,pos:new THREE.Vector3(x,y,z),joined:false});
 }
 makeConnector(-5.3,5.0,3.0);makeConnector(5.1,4.9,2.9);makeConnector(-2.9,4.7,2.8);
 function sparkAt(p){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,8),new THREE.MeshBasicMaterial({color:'#fff3b0',transparent:true,opacity:1}));
  s.position.copy(p);g.add(s);
  const pl=new THREE.PointLight('#ffe79a',14,8,2);pl.position.copy(p);g.add(pl);
  sparks.push({m:s,l:pl,t:0});
 }
 function pickConnector(sx,sy){
  rcC.setFromCamera(new THREE.Vector2((sx/innerWidth)*2-1,-(sy/innerHeight)*2+1),camera);
  const orbs=connectors.filter(c=>!c.joined).map(c=>c.orb);if(!orbs.length)return -1;
  const hit=rcC.intersectObjects(orbs,false)[0];if(!hit)return -1;
  return connectors.findIndex(c=>c.orb===hit.object);
 }
 function joinWire(i){const c=connectors[i];if(!c||c.joined)return false;c.joined=true;
  c.orb.visible=false;c.box.visible=true;c.box.material.emissiveIntensity=1.2;
  sparkAt(c.pos);return true;}  // just connects the line — bulbs stay dark until the circuits are fixed (quizzes)

 let t=0;
 function update(dt){
  t+=dt;
  updateRio(dt);
  if(connectorsLive){const pulse=0.6+Math.sin(t*6)*0.5;connectors.forEach(c=>{if(!c.joined)c.orbMat.emissiveIntensity=pulse;});}
  for(let si=sparks.length-1;si>=0;si--){const sp=sparks[si];sp.t+=dt;const f=sp.t/0.45;sp.m.scale.setScalar(0.5+f*2.2);sp.m.material.opacity=Math.max(0,1-f);sp.l.intensity=14*(1-f);if(f>=1){g.remove(sp.m);g.remove(sp.l);sparks.splice(si,1);}}
  wheel.rotation.x+=dt*0.8;
  // gentle camera idle sway
  camera.position.x=9.5+Math.sin(t*0.12)*0.9;
  camera.position.y=7.5+Math.sin(t*0.09)*0.3;
  camera.lookAt(0,1.9,0.3);
  // flicker lit lamps subtly
  lamps.forEach(L=>{if(L.lit)L.light.intensity=14+Math.sin(t*20+L.light.position.x)*1.4;});
  lanternLight.intensity=5.5+Math.sin(t*8)*0.6;
 }
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}

 return {scene,camera,update,resize,anchors,applyGlow,lightLamp,lightHouse,getGlow:()=>glowAmt,cheer:()=>{rioCheerT=2.4;},rioGloves:(on)=>rio.setGloves(on),rioBoots:(on)=>rio.setBoots(on),showConnectors:(on)=>{connectorsLive=on;if(!on)connectors.forEach(c=>{if(!c.joined)c.orbMat.emissiveIntensity=0;});},connectorCount:()=>connectors.length,pickConnector,joinWire,allJoined:()=>connectors.every(c=>c.joined)};
}

/* ========================= puzzle 1: complete the circuit ========================= */
function runCircuitBuilder(ie,audio){
 return new Promise(resolve=>{
  // SVG node layout
  const W=560,H=360;
  const nodes={
   'Bp':{x:120,y:90,t:'+'},   // battery +
   'Bn':{x:120,y:270,t:'-'},  // battery -
   'La':{x:430,y:70},         // bulb left terminal
   'Lb':{x:430,y:150},        // bulb right terminal
   'Sa':{x:300,y:300},        // switch terminal a
   'Sb':{x:430,y:300}         // switch terminal b
  };
  let wires=[];        // array of [idA,idB]
  let swClosed=false;
  let selected=null;
  let bulbLit=false;

  const sv=ie.station(`
   <h3>${IC('bolt')} Puzzle 1 — Complete the Circuit</h3>
   <p class="sub">Tap one terminal, then another, to add a wire. Tap a wire to remove it. Close the switch, then press Check.</p>
   <div class="svgbox"><svg viewBox="0 0 ${W} ${H}" id="cir"></svg></div>
   <p class="msg" id="cmsg">Make a complete loop: battery → bulb → switch → back to battery.</p>
   <div class="brow">
     <button class="btn brown" id="cclear">${IC('restart')}<span>Clear wires</span></button>
     <button class="btn gold" id="csw"><span>Switch: OPEN</span></button>
     <button class="btn" id="ccheck">${IC('check')}<span>Check</span></button>
   </div>`);
  const svg=sv.q('#cir'),msg=sv.q('#cmsg');
  const NS='http://www.w3.org/2000/svg';
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

  function draw(){
   svg.innerHTML='';
   // battery body
   svg.appendChild(el('rect',{x:60,y:120,width:120,height:120,rx:14,fill:'#f4d06a',stroke:'#b07a14','stroke-width':4}));
   const bt=el('text',{x:120,y:190,'text-anchor':'middle','font-family':'Fredoka,sans-serif','font-size':26,'font-weight':600,fill:'#6b4a00'});bt.textContent='VOLTS';svg.appendChild(bt);
   // bulb
   const lit=false;
   svg.appendChild(el('circle',{cx:430,cy:110,r:40,fill: bulbLit?'#ffe67a':'#dfe3e8',stroke:'#b0b6bd','stroke-width':4}));
   if(bulbLit){svg.appendChild(el('circle',{cx:430,cy:110,r:58,fill:'none',stroke:'#ffd34d','stroke-width':6,opacity:.6}));}
   const bulbIcon=el('path',{d:'M430 92 l-10 24 h20 z',fill:'#c9872a'});svg.appendChild(bulbIcon);
   // switch base
   svg.appendChild(el('line',{x1:300,y1:300,x2:430,y2:300,stroke:'#cbbfa6','stroke-width':4}));
   const lever=el('line',{x1:300,y1:300,x2:swClosed?430:400,y2:swClosed?300:250,stroke:'#7a4e2d','stroke-width':8,'stroke-linecap':'round'});svg.appendChild(lever);
   const swt=el('text',{x:365,y:340,'text-anchor':'middle','font-family':'Fredoka','font-size':16,fill:'#7a6650'});swt.textContent=swClosed?'switch closed':'switch open';svg.appendChild(swt);
   // existing wires
   wires.forEach((w,i)=>{const a=nodes[w[0]],b=nodes[w[1]];const line=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#c8502f','stroke-width':7,'stroke-linecap':'round',style:'cursor:pointer'});line.addEventListener('click',ev=>{ev.stopPropagation();wires.splice(i,1);audio.play('pop');draw();});svg.appendChild(line);});
   // nodes
   for(const id in nodes){const n=nodes[id];const c=el('circle',{cx:n.x,cy:n.y,r:14,fill:selected===id?'#2a7fc0':'#fff',stroke:selected===id?'#185a8c':'#7a4e2d','stroke-width':4,style:'cursor:pointer'});c.addEventListener('click',ev=>{ev.stopPropagation();onNode(id);});svg.appendChild(c);if(n.t){const tt=el('text',{x:n.x,y:n.y+6,'text-anchor':'middle','font-family':'Fredoka','font-size':18,'font-weight':700,fill:'#6b4a00','pointer-events':'none'});tt.textContent=n.t;svg.appendChild(tt);}}
  }
  function onNode(id){
   audio.play('pop');
   if(selected===null){selected=id;draw();return;}
   if(selected===id){selected=null;draw();return;}
   // add wire if not duplicate
   const dup=wires.some(w=>(w[0]===selected&&w[1]===id)||(w[0]===id&&w[1]===selected));
   if(!dup)wires.push([selected,id]);
   selected=null;draw();
  }
  // connectivity check
  function connected(edges,start,goal){
   const adj={};edges.forEach(([a,b])=>{(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);});
   const seen=new Set([start]),st=[start];
   while(st.length){const c=st.pop();if(c===goal)return true;(adj[c]||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);st.push(n);}});}
   return false;
  }
  function check(){
   // internal edges: bulb filament La-Lb always; switch Sa-Sb only if closed
   const internal=[['La','Lb']];if(swClosed)internal.push(['Sa','Sb']);
   const edges=[...wires,...internal];
   const loop=connected(edges,'Bp','Bn');
   // bulb must be in series: removing bulb filament disconnects Bp..Bn
   const noBulb=edges.filter(e=>!(e[0]==='La'&&e[1]==='Lb'));
   const bulbInSeries=loop&&!connected(noBulb,'Bp','Bn');
   if(!swClosed && connectedIgnoringSwitch()){msg.textContent='So close! The switch is still OPEN — close it to finish the path.';msg.className='msg bad';audio.play('spark');return;}
   if(loop&&bulbInSeries&&swClosed){
     bulbLit=true;draw();audio.play('bulbon');audio.play('good');
     msg.textContent='The bulb lights up! A complete, closed loop lets electricity flow.';msg.className='msg ok';
     setTimeout(()=>{sv.close();bulbLit=false;resolve(true);},1600);
     return;
   }
   // find a failure reason
   const used=new Set();wires.forEach(w=>{used.add(w[0]);used.add(w[1]);});
   const need=['Bp','Bn','La','Lb','Sa','Sb'];
   const open=need.find(n=>!used.has(n));
   if(open){msg.textContent='A wire end is loose — the '+label(open)+' is not connected. Electricity needs an unbroken path.';}
   else if(!bulbInSeries){msg.textContent='The current skips the bulb. Wire it so current must pass THROUGH the bulb.';}
   else{msg.textContent='The loop is broken somewhere. One wire is not enough — trace the whole path.';}
   msg.className='msg bad';audio.play('spark');
   // spark the open node red
   if(open){const n=nodes[open];const flash=el('circle',{cx:n.x,cy:n.y,r:22,fill:'none',stroke:'#e03a1a','stroke-width':5});svg.appendChild(flash);let o=1;const iv=setInterval(()=>{o-=.12;flash.setAttribute('opacity',Math.max(0,o));if(o<=0)clearInterval(iv);},40);}
  }
  function connectedIgnoringSwitch(){const internal=[['La','Lb'],['Sa','Sb']];const edges=[...wires,...internal];const noBulb=edges.filter(e=>!(e[0]==='La'&&e[1]==='Lb'));return connected(edges,'Bp','Bn')&&!connected(noBulb,'Bp','Bn');}
  function label(id){return{Bp:'battery +',Bn:'battery −',La:'top of the bulb',Lb:'bottom of the bulb',Sa:'left of the switch',Sb:'right of the switch'}[id];}

  sv.q('#cclear').addEventListener('click',()=>{wires=[];selected=null;bulbLit=false;msg.textContent='Wires cleared. Try again!';msg.className='msg';audio.play('pop');draw();});
  sv.q('#csw').addEventListener('click',ev=>{swClosed=!swClosed;ev.currentTarget.querySelector('span').textContent='Switch: '+(swClosed?'CLOSED':'OPEN');audio.play('tap');draw();});
  sv.q('#ccheck').addEventListener('click',()=>{audio.play('tap');check();});
  bulbLit=false;draw();
 });
}

/* ========================= puzzle 2: current flow ========================= */
function runCurrentFlow(ie,audio){
 return new Promise(resolve=>{
  const sv=ie.station(`
   <h3>${IC('power')} Puzzle 2 — Does the Bulb Use Up Current?</h3>
   <p class="sub">Press “Show the flow” and watch the current. Compare what enters and leaves the bulb.</p>
   <div class="svgbox"><svg viewBox="0 0 560 300" id="flow"></svg></div>

   </div>`);
  const svg=sv.q('#flow'),msg=sv.q('#fmsg');
  const NS='http://www.w3.org/2000/svg';
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // rounded-rect loop path
  const d='M120 90 H300 Q430 90 430 160 Q430 230 300 230 H120 Q60 230 60 160 Q60 90 120 90 Z';
  svg.appendChild(el('path',{d,fill:'none',stroke:'#cbbfa6','stroke-width':14,'stroke-linecap':'round'}));
  const path=el('path',{d,fill:'none',stroke:'#2a7fc0','stroke-width':8,'stroke-linecap':'round',id:'wirepath'});svg.appendChild(path);
  // battery
  svg.appendChild(el('rect',{x:30,y:135,width:60,height:50,rx:10,fill:'#f4d06a',stroke:'#b07a14','stroke-width':4}));
  const vt=el('text',{x:60,y:166,'text-anchor':'middle','font-family':'Fredoka','font-size':14,fill:'#6b4a00'});vt.textContent='VOLTS';svg.appendChild(vt);
  // bulb
  svg.appendChild(el('circle',{cx:430,cy:160,r:34,fill:'#ffe67a',stroke:'#e0a93a','stroke-width':4}));
  svg.appendChild(el('circle',{cx:430,cy:160,r:50,fill:'none',stroke:'#ffd34d','stroke-width':5,opacity:.5}));
  // labels for in/out around bulb
  const inL=el('text',{x:330,y:138,'text-anchor':'middle','font-family':'Nunito','font-size':15,'font-weight':900,fill:'#2f6e1c'});inL.textContent='IN';svg.appendChild(inL);
  const outL=el('text',{x:330,y:242,'text-anchor':'middle','font-family':'Nunito','font-size':15,'font-weight':900,fill:'#c8502f'});outL.textContent='OUT';svg.appendChild(outL);
  const pathEl=svg.querySelector('#wirepath');const len=pathEl.getTotalLength();
  const dots=[];for(let i=0;i<10;i++){const c=el('circle',{r:6,fill:'#ffd34d',stroke:'#e08a1a','stroke-width':2,opacity:0});svg.appendChild(c);dots.push(c);}
  let running=false,prog=0,raf=null,count=0,ticks=0;
  sv.q('#fshow').addEventListener('click',()=>{if(running)return;running=true;audio.play('zap');ie.counters.show(true);msg.textContent='The current flows round and round — keep watching the two counters.';msg.className='msg';
   const step=()=>{prog=(prog+0.004)%1;dots.forEach((c,i)=>{const p=(prog+i/10)%1;const pt=pathEl.getPointAtLength(p*len);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('opacity',1);});
    ticks++;if(ticks%16===0){count=Math.min(5,count+1);ie.counters.set(count,count);if(count>=5){msg.textContent='Look — 5 A go IN and 5 A come OUT. The bulb does NOT use up the current!';msg.className='msg ok';sv.q('#fdone').disabled=false;audio.play('good');}}
    raf=requestAnimationFrame(step);};
   step();
  });
  sv.q('#fdone').addEventListener('click',()=>{cancelAnimationFrame(raf);ie.counters.show(false);sv.close();resolve(true);});
 });
}

/* ========================= puzzle 3: conductor sort ========================= */
function runConductorSort(ie,audio){
 return new Promise(resolve=>{
  const items=[
   {id:'spoon',em:'🕊',name:'Steel spoon',cond:true,why:'Metal — it lets current pass.'},
   {id:'coin',em:'🪙',name:'Coin',cond:true,why:'Metal — a good conductor.'},
   {id:'key',em:'🔑',name:'Key',cond:true,why:'Metal — current flows through it.'},
   {id:'foil',em:'✨',name:'Foil',cond:true,why:'Thin metal — it conducts.'},
   {id:'pencil',em:'✏',name:'Pencil wood',cond:false,why:'Wood is an insulator.'},
   {id:'comb',em:'🧽',name:'Plastic comb',cond:false,why:'Plastic does not conduct.'},
   {id:'rubber',em:'⚫',name:'Rubber band',cond:false,why:'Rubber blocks current.'},
   {id:'leaf',em:'🍂',name:'Dry leaf',cond:false,why:'A dry leaf does not conduct.'}
  ];
  const place={}; // id -> 'will' | 'wont' | null
  items.forEach(i=>place[i.id]=null);
  const objHtml=i=>`<div class="obj" data-id="${i.id}"><span class="em">${i.em}</span><span>${i.name}</span></div>`;
  const sv=ie.station(`
   <h3>${IC('bolt')} Puzzle 3 — What Can Complete the Circuit?</h3>
   <p class="sub">Tap an object, then tap a basket. Sort all eight, then press Test to try each in the circuit gap.</p>
   <div class="tray" id="tray">${items.map(objHtml).join('')}</div>
   <div class="baskets">
     <div class="basket will" id="bwill"><div class="bt">${IC('bulb')} Will light</div><div class="bitems"></div></div>
     <div class="basket wont" id="bwont"><div class="bt">${IC('lock')} Won't light</div><div class="bitems"></div></div>
   </div>
   <p class="msg" id="smsg">Sort every object into a basket.</p>
   <div class="brow"><button class="btn" id="stest" disabled>${IC('power')}<span>Test them all</span></button></div>`);
  const tray=sv.q('#tray'),bwill=sv.q('#bwill .bitems'),bwont=sv.q('#bwont .bitems'),msg=sv.q('#smsg'),testBtn=sv.q('#stest');
  let sel=null;
  function render(){
   tray.innerHTML='';bwill.innerHTML='';bwont.innerHTML='';
   items.forEach(i=>{const node=A('div','obj'+(sel===i.id?' lit':''),`<span class="em">${i.em}</span><span>${i.name}</span>`);node.dataset.id=i.id;node.addEventListener('click',()=>{audio.play('pop');sel=sel===i.id?null:i.id;render();});
    (place[i.id]==='will'?bwill:place[i.id]==='wont'?bwont:tray).appendChild(node);});
   const allPlaced=items.every(i=>place[i.id]);testBtn.disabled=!allPlaced;
  }
  function putInto(basket){if(!sel)return;place[sel]=basket;sel=null;audio.play('tap');const left=items.filter(i=>!place[i.id]).length;msg.textContent=left?`${left} object${left>1?'s':''} left to sort.`:'All sorted! Press “Test them all”.';msg.className='msg';render();}
  sv.q('#bwill').addEventListener('click',()=>putInto('will'));
  sv.q('#bwont').addEventListener('click',()=>putInto('wont'));
  testBtn.addEventListener('click',async()=>{
   testBtn.disabled=true;let wrong=0;
   for(const i of items){
    const correct=i.cond?'will':'wont';
    const node=[...sv.el.querySelectorAll('.obj')].find(n=>n.dataset.id===i.id);
    if(i.cond){node&&node.classList.add('lit');audio.play('bulbon');}else{audio.play('zap');}
    msg.textContent=`${i.name}: ${i.cond?'the bulb lights!':'no light.'} ${i.why}`;msg.className='msg '+(i.cond?'ok':'bad');
    await wait(650);
    if(place[i.id]!==correct){
     wrong++;place[i.id]=correct;render();
     const moved=[...sv.el.querySelectorAll('.obj')].find(n=>n.dataset.id===i.id);
     if(moved){moved.classList.add('flag');const fl=A('span','fl','!');moved.appendChild(fl);audio.play('error');}
     msg.textContent=`${i.name} jumps to the right basket — ${i.why}`;msg.className='msg bad';
     await wait(900);
    }
   }
   msg.textContent=wrong?`Tested! ${wrong} jumped baskets. Conductors (metals) light the bulb; insulators do not.`:'Perfect sort! Metals conduct; wood, plastic, rubber and leaves do not.';
   msg.className='msg ok';audio.play('good');
   await wait(900);sv.close();resolve(true);
  });
  render();
 });
}

  'Puzzle 1: Electricity needs a FULL loop. Wire battery + to the bulb, the bulb to the switch, and the switch back to battery −. Then CLOSE the switch.',

 ];

 // marker projection each frame

 });

 async function appCards(){

   <div class="pages">

    <div class="page"><b>Why a switch must close</b><p>A switch is a gap you can open and shut. Closed, it completes the loop and current flows. Open, the path is broken and the bulb goes dark.</p></div>
   </div>`,[{label:'Close'}]);
 }

 function connectPower(){

 async function intro(){

  // SAFETY GEAR-UP — put each item on Rio, shown on his 3D model
  await ie.modal(`<h2>${IC('bolt')} Safety first!</h2>
   <div class="warnrow">${IC('bolt')} Electricity must be handled carefully. Never touch live wires with bare hands or wet feet.</div>
   <p style="font-size:.95em;color:#5c4a3a">Rubber is an <b>insulator</b> — it stops the current reaching you. Let's put my safety gear on, step by step.</p>`,
   [{label:'🧤 Put on rubber gloves',color:'blue'}]);
  village.rioGloves&&village.rioGloves(true);audio.play('tap');
  await ie.say(['Rubber gloves on — see the blue gloves on my hands? Rubber is an insulator, so the current can’t reach me.']);ie.hideDialogue();
  await ie.modal(`<h2>${IC('bolt')} Almost ready…</h2>
   <div class="gear"><div class="g"><span class="em">🥾</span><b>Safety boots</b><small>Keep feet dry &amp; safe</small></div></div>
   <p style="font-size:.95em;color:#5c4a3a">Dry feet stay safe — rubber boots stop the current passing through you into the ground.</p>`,
   [{label:'🥾 Put on safety boots',color:'gold'}]);
  village.rioBoots&&village.rioBoots(true);audio.play('good');
  await ie.say(['Boots on too — now I’m fully protected! First, let’s reconnect the power lines — tap each glowing junction ⚡ to join the wire.']);ie.hideDialogue();
  await connectPower();
  await ie.say(['The lines are live again — sparks flew and the first lamps woke up! Now tap the glowing spot at the solar house to fix the circuits.']);
  ie.hideDialogue();
  // reveal markers
  ie.markersVisible(true);
  ie.addMarker('p1','Complete the circuit','bolt','open',openPuzzle);
  ie.addMarker('p2','Current & the bulb','power','locked',openPuzzle);
  ie.addMarker('p3','Conductors','bulb','locked',openPuzzle);
  ie.hud.steps(puzzleTitles,0);
 }

 async function openPuzzle(id){
  if(S.busy)return;
  const idx={p1:0,p2:1,p3:2}[id];
  if(idx>0&&!S.done[idx-1]){ie.tell('Finish the earlier puzzle first!',2.5);audio.play('error');return;}
  if(S.done[idx]){ie.tell('You already fixed this one!',2);return;}
  S.busy=true;ie.markersVisible(false);ie.hideDialogue();

  if(idx===0){
   const p=await ie.predict('Rio asks: how many wires does the bulb need to light?',['Just one wire is enough','It needs two — a full loop','No wires, only a battery'],{id:'closed-loop',answer:1});
   await runCircuitBuilder(ie,audio);
   ie.toast('A complete circuit','Electricity needs a complete, closed path to flow. One wire is not enough — you need a full loop.','power.circuit');
  }else if(idx===1){
   const p=await ie.predict('Is the current used up by the bulb?',['More current goes in than comes out','The same amount in and out','Less goes in than comes out'],{id:'current-flow',answer:1,misconceptionId:'current_consumed',misconceptionChoice:0});
   await runCurrentFlow(ie,audio);
   ie.toast('Current is not used up','The current entering the bulb equals the current leaving it. The bulb turns electrical energy into light — it does not consume the current.','power.current');
  }else{
   const p=await ie.predict('Will any solid object light the bulb?',['Yes — every solid object will','No — only some materials will','Only soft objects will'],{id:'conductors',answer:1});
   await runConductorSort(ie,audio);
   ie.toast('Conductors & insulators','Conductors (metals) let current pass and light the bulb. Insulators like wood, plastic and rubber do not.','power.conductors');
  }

  S.done[idx]=true;S.busy=false;
  ie.setMarkerState(id,'done');
  village.lightLamp(idx);          // one street lamp per puzzle
  village.cheer&&village.cheer();  // Rio celebrates
  village.applyGlow(Math.max(village.getGlow(),Math.min(0.72,0.34*S.done.filter(Boolean).length))); // brighten more per puzzle (never dim)
  ie.hud.setProgress(S.done.filter(Boolean).length);
  ie.markersVisible(true);
  const nextIdx=idx+1;
  if(nextIdx<3){ie.setMarkerState(['p1','p2','p3'][nextIdx],'open',puzzleTitles[nextIdx]);ie.hud.steps(puzzleTitles,nextIdx);
   await ie.say(['Brilliant work! A street lamp just flickered on. Tap the next glowing spot.']);ie.hideDialogue();
  }else{
   ie.hud.steps(puzzleTitles,3);
   await ending();
  }
 }

 async function ending(){
  ie.markersVisible(false);ie.hideDialogue();
  await ie.say(['All three puzzles solved! Come outside with me — let’s see what happens.']);
  await ie.fade(true,'#07101c');
  // brighten the world + light the house
  const start=performance.now();const g0=village.getGlow();
  await new Promise(res=>{const an=()=>{const t=clamp((performance.now()-start)/2200,0,1);village.applyGlow(g0+(1-g0)*t);if(t<1)requestAnimationFrame(an);else res();};an();});
  village.lightHouse();audio.play('win');
  await ie.fade(false,'#07101c');
  await ie.say(['Look at that! The three street lamps are glowing and the solar house has turned from grey to bright yellow.','You brought the light back to Palampur. Let’s do a quick Village Check-up.']);
  ie.hideDialogue();
  await checkup();
 }

 async function checkup(){
  const qs=[
   {q:'What does electricity need to flow?',opts:['A single wire','A complete, closed loop','A very long wire'],a:1},
   {q:'Is the current used up by the bulb?',opts:['Yes, it disappears','No — same in and out','Only half is used'],a:1},
   {q:'Which lets current pass through it?',opts:['A plastic comb','A rubber band','A metal key'],a:2},
   {q:'Transfer question: Will a steel spoon complete the circuit?',opts:['Yes — steel is a metal (conductor)','No — spoons are insulators'],a:0}
  ];
  let score=0;
  for(let i=0;i<qs.length;i++){
   const p=await ie.predict(`Check-up ${i+1}/4: ${qs[i].q}`,qs[i].opts,{id:['check-loop','check-current','check-conductors','check-transfer'][i],answer:qs[i].a,misconceptionId:i===1?'current_consumed':undefined,misconceptionChoice:0});
   const ok=p.choice===qs[i].a;if(ok)score++;
   await ie.modal(`<h2>${ok?IC('check'):IC('bolt')} ${ok?'Correct!':'Not quite'}</h2><p>${ok?'Yes! '+explain(i):explain(i)}</p>`,[{label:'Next',icon:'play'}]);
  }
  window.RebuildTelemetry.complete(score * 25);
  const stars=score>=4?3:score>=2?2:1;
  const starHtml=[0,1,2].map(i=>`<svg class="ic ${i<stars?'':'off'}" viewBox="0 0 24 24">${ICONS.star}</svg>`).join('');
  const r=await ie.modal(`<h2>${IC('bolt')} Village Check-up complete!</h2><div class="stars">${starHtml}</div><p>You scored ${score} / 4. You brought light back to Palampur!</p>
   ${(()=>{const NB=window.RebuildNotebook;return NB?`<p class="rnb-summary">Notebook: ${NB.count('power')} / ${NB.total('power')} parts unlocked in this module · ${NB.count()} / ${NB.total()} overall</p>`:'';})()}
   <div class="pages">
    <div class="page"><b>Complete circuit</b><p>Electricity needs a closed loop.</p></div>
    <div class="page"><b>Current flows</b><p>The bulb uses energy, not current.</p></div>
    <div class="page"><b>Conductors</b><p>Metals conduct; others insulate.</p></div>
    <div class="page"><b>Stay safe</b><p>Gloves &amp; boots, never wet hands.</p></div>
   </div>`,
   (()=>{const a=[{label:'Real-life cards',icon:'bolt',color:'gold'}];if(window.RebuildJourney&&window.RebuildJourney.active)a.push({label:window.RebuildJourney.nextLabel,icon:'play',color:'gold'});a.push({label:'Play again',icon:'restart',color:'orange'});return a;})());
  if(r===0){await appCards();location.reload();return;}
  if(window.RebuildJourney&&window.RebuildJourney.active&&r===1){window.RebuildJourney.complete();return;}
  location.reload();
 }
 function explain(i){return['Electricity needs a complete, closed path — a single wire cannot carry it round.','The current entering the bulb equals the current leaving. The bulb turns energy into light.','Metals like a key conduct electricity; plastic and rubber are insulators.','Steel is a metal, so a steel spoon is a conductor — it completes the circuit and lights the bulb.'][i];}

 return {intro};
}

/* ========================= bootstrap ========================= */
const canvas=document.getElementById('c');
const Cn=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
Cn.setPixelRatio(Math.min(devicePixelRatio,1.5));
Cn.setSize(innerWidth,innerHeight);
Cn.shadowMap.enabled=true;Cn.shadowMap.type=THREE.PCFShadowMap;
Cn.toneMapping=THREE.ACESFilmicToneMapping;Cn.toneMappingExposure=1.05;
Cn.outputColorSpace=THREE.SRGBColorSpace;

const audio=makeAudio();
const ie=buildUI(audio);
let village=null,game=null,paused=false,last=performance.now();

async function boot(){
 ie.title.progress(.25,'Wiring the poles…');await wait(60);
 village=buildVillage(Cn);
 ie.title.progress(.7,'Painting the solar house…');await wait(60);
 ie.setPortrait(makePortrait());
 ie.title.progress(1,'Ready!');ie.title.ready();
}
async function startModule(){
 ie.title.hide();audio.startAmbient();
 ie.hud.show(true);
 game=startGame(ie,audio,village,Cn);
 await ie.fade(false);
 game.intro();
}
ie.title.onStart(startModule);
ie.hud.onBack(async()=>{if(await ie.modal('<h2>Restart module?</h2><p>Your progress will be lost.</p>',[{label:'Keep playing'},{label:'Restart',color:'orange'}])===1)location.reload();});
ie.hud.onPause(async()=>{paused=true;const r=await ie.modal('<h2>Paused</h2>',[{label:'Resume',icon:'play'},{label:'Restart',icon:'restart',color:'orange'}]);paused=false;if(r===1)location.reload();});
ie.hud.onNotebook(()=>ie.showNotebook());

// tap canvas -> raycast markers handled via HTML; nothing to pick in 3D for now
addEventListener('resize',()=>{Cn.setSize(innerWidth,innerHeight);village&&village.resize();});

function loop(now){
 requestAnimationFrame(loop);
 let dt=Math.min((now-last)/1000,.05);last=now;if(paused)dt=0;
 if(village){village.update(dt);village._project&&village._project();Cn.render(village.scene,village.camera);}
}
requestAnimationFrame(loop);
boot();
</script>
