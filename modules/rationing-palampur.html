<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Rebuild – Rationing Module</title>
<link rel="stylesheet" href="../shared/rebuild-shell.css">
<link rel="stylesheet" href="../shared/game-fonts.css">
<script vite-ignore src="../shared/rebuild-telemetry.js"></script>
<script vite-ignore src="../shared/rebuild-notebook.js"></script>
<script vite-ignore defer src="../shared/rebuild-shell.js"></script>
<style>
:root{--ink:#2b2118;--cream:#fff8ea;--cream2:#f6e6c4;--wood:#7a4e2d;--wood2:#5a3720;--green:#4fa52f;--green2:#2f6e1c;--blue:#2a7fc0;--blue2:#185a8c;--red:#c8502f;--gold:#f2c14e;
--u:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2430;font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:calc(18px*var(--u))}
#ui button{pointer-events:auto;font-family:inherit}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.panel{background:linear-gradient(180deg,var(--cream),var(--cream2));border:calc(4px*var(--u)) solid var(--wood);border-radius:calc(20px*var(--u));box-shadow:inset 0 calc(-5px*var(--u)) 0 rgba(122,78,45,.18),inset 0 2px 0 #fff,0 calc(10px*var(--u)) calc(26px*var(--u)) rgba(20,12,4,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:none;cursor:pointer;font-family:Fredoka,Nunito,sans-serif!important;font-weight:600;font-size:1.15em;color:#fff;padding:.62em 1.3em;border-radius:999px;background:linear-gradient(180deg,#6cc544,var(--green));border-bottom:calc(6px*var(--u)) solid var(--green2);text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 calc(8px*var(--u)) calc(18px*var(--u)) rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,border-width .08s,filter .2s;position:relative;overflow:hidden;min-height:44px}
.btn:active,.btn.down{transform:translateY(3px);border-bottom-width:calc(3px*var(--u))}
.btn:disabled{filter:grayscale(.8) brightness(.85);cursor:default}
.btn.blue{background:linear-gradient(180deg,#4aa3e0,var(--blue));border-bottom-color:var(--blue2)}
.btn.orange{background:linear-gradient(180deg,#f08a4b,#d7632b);border-bottom-color:#9a3f17}
.btn.brown{background:linear-gradient(180deg,#a8754a,var(--wood));border-bottom-color:var(--wood2)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#f0b43a);border-bottom-color:#b07a14;color:#3a2610;text-shadow:none}
.btn.red{background:linear-gradient(180deg,#e0663e,var(--red));border-bottom-color:#8f3317}
.btn.ghost{background:rgba(255,248,234,.92);color:var(--wood2);border-bottom-color:#c9ae84;text-shadow:none}
.btn.big{font-size:1.75em;padding:.55em 1.6em}
.btn.small{font-size:.95em;padding:.45em 1em}
.btn .fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(255,255,255,.22);pointer-events:none}
.ibtn{width:calc(54px*var(--u));height:calc(54px*var(--u));min-width:44px;min-height:44px;border-radius:calc(16px*var(--u));border:calc(4px*var(--u)) solid var(--wood);background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:1.25em}
.ibtn:active{transform:translateY(2px)}

/* title */
.screen{position:absolute;inset:0;pointer-events:auto;transition:opacity .6s}
.screen.out{opacity:0;pointer-events:none}
.title{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,26,40,.15) 0%,rgba(20,26,40,.78) 100%)}
.title-inner{display:flex;flex-direction:column;align-items:center;gap:calc(14px*var(--u));text-align:center;padding:20px}
.logo{display:flex;gap:.02em;font-family:Fredoka,sans-serif;font-weight:700;font-size:calc(118px*var(--u));line-height:1;letter-spacing:.02em}
.logo span{display:inline-block;color:#ffd65c;-webkit-text-stroke:calc(5px*var(--u)) #6b2a12;paint-order:stroke fill;text-shadow:0 calc(8px*var(--u)) 0 #6b2a12,0 calc(16px*var(--u)) calc(30px*var(--u)) rgba(0,0,0,.5);animation:bob 2.6s ease-in-out infinite}
.logo span:nth-child(2n){color:#ffb347}
.logo span:nth-child(1){animation-delay:0s}.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}.logo span:nth-child(5){animation-delay:.48s}.logo span:nth-child(6){animation-delay:.6s}.logo span:nth-child(7){animation-delay:.72s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(calc(-8px*var(--u))) rotate(1.5deg)}}
.tagline{margin:0;color:#fff;font-weight:900;font-size:1.35em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.loadbar{width:calc(440px*var(--u));max-width:80vw;height:calc(18px*var(--u));border-radius:99px;background:rgba(0,0,0,.35);border:3px solid var(--cream);overflow:hidden;margin-top:calc(16px*var(--u))}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd65c,#ffb347);transition:width .3s}
.loadtxt{margin:0;color:#fff;font-weight:800;font-size:.9em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.title .start{opacity:0;transform:scale(.9);transition:all .4s}
.title.ready .start{opacity:1;transform:scale(1);animation:pulse 1.6s ease-in-out infinite}
.title.ready .loadbar,.title.ready .loadtxt{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,92,.6),0 10px 24px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 calc(14px*var(--u)) rgba(255,214,92,0),0 10px 24px rgba(0,0,0,.3)}}
.hint{margin:0;display:flex;align-items:center;gap:.4em;color:#fff;font-weight:800;font-size:.85em;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chips{position:absolute;top:calc(18px*var(--u));left:calc(18px*var(--u));display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:rgba(255,248,234,.92);color:var(--ink);font-weight:900;font-size:.75em;padding:.45em .9em;border-radius:99px}

/* hud */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(14px*var(--u)) calc(16px*var(--u));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;opacity:0;transform:translateY(-20px);transition:all .5s}
.hud.on{opacity:1;transform:none}
.hud .right{display:flex;gap:calc(10px*var(--u))}
.hud .progress{display:flex;align-items:center;gap:.6em;padding:.45em .9em;font-family:Fredoka,sans-serif;font-size:1em;pointer-events:none;transition:opacity .3s}
.hud .progress.off{display:none}
.hud .progress b{font-weight:600}
.segs{display:flex;gap:4px}
.segs i{width:calc(28px*var(--u));height:calc(12px*var(--u));border-radius:6px;background:#dccdb0;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.segs i.on{background:linear-gradient(180deg,#ffd76a,var(--gold));box-shadow:0 0 8px rgba(242,193,78,.9)}
.hud .steps{display:none;gap:.35em;padding:.35em .5em;flex-wrap:wrap;justify-content:center}
.hud .steps.on{display:flex}
.steps span{display:inline-flex;align-items:center;gap:.3em;font-weight:900;font-size:.8em;padding:.32em .75em;border-radius:99px;background:#e9dcc3;color:#7a6650}
.steps span em{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;background:#cdbb9b;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
.steps span.done{background:#d8ecc9;color:#2f5a1c}
.steps span.cur{background:linear-gradient(180deg,#4aa3e0,var(--blue));color:#fff;box-shadow:0 0 0 3px var(--gold)}
.steps span.cur em{background:rgba(255,255,255,.3)}

/* markers */
.markers{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.markers.on{opacity:1}
.markers.on .marker{pointer-events:auto}
.marker{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;cursor:pointer;transform:translate(-50%,-100%);pointer-events:none;will-change:transform}
.marker .disc{position:relative;width:calc(64px*var(--u));height:calc(64px*var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6em;border:calc(4px*var(--u)) solid #fff;background:#857a6c;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.marker .badge{position:absolute;right:-8px;bottom:-6px;width:calc(28px*var(--u));height:calc(28px*var(--u));border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:.55em;border:2px solid #fff}
.marker .lbl{background:rgba(43,33,24,.82);color:#fff7e8;font-weight:900;font-size:.72em;padding:.3em .8em;border-radius:99px;white-space:nowrap}
.marker.open .disc{background:linear-gradient(180deg,#ffd76a,#f0a93a);color:#5a3200;width:calc(80px*var(--u));height:calc(80px*var(--u));font-size:2em;animation:mpulse 1.5s ease-in-out infinite}
.marker.open .badge{display:none}
.marker.open .lbl{background:#d7632b;font-size:.85em;border:2px solid #fff}
.marker.done .disc{background:linear-gradient(180deg,#6cc544,var(--green))}
.marker.done .badge{background:var(--green2)}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,92,.75),0 8px 18px rgba(0,0,0,.35);transform:translateY(0)}50%{box-shadow:0 0 0 calc(16px*var(--u)) rgba(255,214,92,0),0 8px 18px rgba(0,0,0,.35);transform:translateY(-6px)}}

/* dialogue */
.dialogue{position:absolute;left:50%;bottom:calc(16px*var(--u));width:min(calc(880px*var(--u)),calc(100% - 24px));transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:flex-end;pointer-events:none}
.dialogue.on{transform:translate(-50%,0);pointer-events:auto}
.dialogue .portrait{width:calc(118px*var(--u));height:calc(118px*var(--u));border-radius:50%;border:calc(5px*var(--u)) solid var(--wood);background:var(--gold);overflow:hidden;flex-shrink:0;margin-right:calc(-26px*var(--u));z-index:1;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.dialogue .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.dialogue .box{flex:1;padding:calc(16px*var(--u)) calc(22px*var(--u)) calc(16px*var(--u)) calc(44px*var(--u));position:relative;min-height:calc(96px*var(--u))}
.dialogue .name{position:absolute;top:calc(-16px*var(--u));left:calc(40px*var(--u));background:linear-gradient(180deg,#e0663e,var(--red));color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:.9em;padding:.2em .9em;border-radius:10px;border:3px solid var(--wood)}
.dialogue .txt{margin:.3em 0 0;font-weight:800;font-size:1.12em;line-height:1.38}
.dialogue .more{position:absolute;right:calc(18px*var(--u));bottom:calc(8px*var(--u));font-weight:900;font-size:.75em;color:#8a6a4a;opacity:0}
.dialogue.wait .more{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* actions */
.actions{position:absolute;right:calc(18px*var(--u));bottom:calc(150px*var(--u));display:flex;flex-direction:column;align-items:flex-end;gap:calc(12px*var(--u))}
.actions .btn{font-size:1.05em}

/* toasts */
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(84px*var(--u));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.toast{display:flex;gap:.7em;align-items:center;padding:.6em 1em;max-width:calc(380px*var(--u));animation:tin .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{transition:all .5s;opacity:0;transform:translateY(-20px)}
.toast .ticon{width:2.2em;height:2.2em;border-radius:12px;background:linear-gradient(180deg,#ffd76a,var(--gold));color:#6b4a00;display:flex;align-items:center;justify-content:center;font-size:1em;flex-shrink:0}
.toast small{display:block;font-weight:900;font-size:.65em;letter-spacing:.06em;color:#b07a14;text-transform:uppercase}
.toast b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.05em}
.toast p{margin:.1em 0 0;font-size:.78em;font-weight:700;color:#5c4a3a}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}}

/* modal */
.modal{position:absolute;inset:0;background:rgba(20,14,8,.5);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .25s;padding:16px}
.modal.out{opacity:0;transition:opacity .25s}
.modal .card{padding:calc(22px*var(--u)) calc(26px*var(--u));max-width:min(calc(640px*var(--u)),94vw);max-height:88vh;overflow:auto;text-align:center}
.modal h2{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 .4em;display:flex;align-items:center;justify-content:center;gap:.4em;font-size:1.5em}
.modal p{font-weight:800;line-height:1.4}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1em}
.modal .pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.modal .page{background:#fff;border:2px solid #e3d3b5;border-radius:14px;padding:.6em .8em}
.modal .page b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--blue2)}
.modal .page p{margin:.2em 0 0;font-size:.85em}
.modal .stars{display:flex;justify-content:center;gap:.2em;font-size:3em;color:var(--gold)}
.modal .stars .ic{fill:var(--gold);stroke:#b07a14;stroke-width:1.2}
.modal .stars .ic.off{fill:#ddd0b8;stroke:#b9a684}
@keyframes fin{from{opacity:0}}

/* predict + confidence */
.opts{display:flex;flex-direction:column;gap:10px;text-align:left;margin:.4em 0}
.opt{display:flex;align-items:center;gap:.6em;padding:.6em .9em;border-radius:14px;border:3px solid #e3d3b5;background:#fff;font-weight:800;cursor:pointer;transition:all .15s}
.opt .dot{width:1.3em;height:1.3em;border-radius:50%;border:3px solid #c9b48c;flex-shrink:0}
.opt.sel{border-color:var(--blue);background:#eaf4fd}
.opt.sel .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.conf{margin-top:.6em}
.conf small{font-weight:900;font-size:.72em;letter-spacing:.06em;color:#8a6a4a;text-transform:uppercase}
.conf .cbtns{display:flex;gap:8px;justify-content:center;margin-top:.4em;flex-wrap:wrap}
.cbtn{padding:.45em .9em;border-radius:99px;border:3px solid #e3d3b5;background:#fff;font-weight:900;font-size:.82em;cursor:pointer;color:#7a6650}
.cbtn.sel{border-color:var(--gold);background:#fff4d8;color:#8a5a00}

/* gear card */
.gear{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:.5em 0 .2em}
.gear .g{width:calc(130px*var(--u));background:#fff;border:3px solid #e3d3b5;border-radius:16px;padding:.7em .5em;display:flex;flex-direction:column;align-items:center;gap:.3em}
.gear .g .em{font-size:2.4em;line-height:1}
.gear .g b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1em;color:var(--wood2)}
.gear .g small{font-size:.72em;font-weight:800;color:#6a5a48}
.warnrow{display:flex;align-items:center;justify-content:center;gap:.5em;background:#fff4d8;border:3px solid var(--gold);border-radius:14px;padding:.5em .8em;margin:.3em 0;font-weight:900;color:#8a5a00;font-size:.92em}

/* two current counters */
.counters{position:absolute;left:50%;top:calc(90px*var(--u));transform:translate(-50%,-10px);display:flex;gap:16px;opacity:0;transition:all .4s;z-index:3}
.counters.on{opacity:1;transform:translate(-50%,0)}
.counter{padding:.45em 1em;text-align:center;min-width:calc(110px*var(--u))}
.counter small{display:block;font-weight:900;font-size:.62em;letter-spacing:.08em;color:#8a6a4a;text-transform:uppercase}
.counter b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.7em;color:var(--blue2);display:block}
.counter.inn b{color:var(--green2)}
.counter.out b{color:var(--red)}
.counter .eq{display:flex;align-items:center;font-family:Fredoka,sans-serif;font-size:2em;color:var(--wood)}

/* station overlay (puzzle panels) */
.station{position:absolute;inset:0;background:rgba(20,14,8,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:14px;animation:fin .25s}
.station .wrap{width:min(calc(760px*var(--u)),96vw);max-height:92vh;overflow:auto;padding:calc(18px*var(--u)) calc(20px*var(--u));text-align:center}
.station h3{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 .2em;font-size:1.35em;display:flex;align-items:center;justify-content:center;gap:.35em}
.station .sub{margin:0 0 .5em;font-weight:800;font-size:.92em;color:#5c4a3a}
.station .svgbox{background:#fbf3df;border:3px solid #e3d3b5;border-radius:16px;padding:8px;margin:.4em auto;max-width:100%}
.station .svgbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.station .brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:.6em}
.msg{min-height:1.4em;font-weight:900;font-size:.9em;margin:.3em 0 0}
.msg.ok{color:var(--green2)}
.msg.bad{color:var(--red)}

/* sort puzzle */
.baskets{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.basket{flex:1;min-width:calc(150px*var(--u));background:#fff;border:3px dashed #c9b48c;border-radius:16px;padding:.5em;min-height:calc(120px*var(--u))}
.basket.will{border-color:var(--green);background:#f0faea}
.basket.wont{border-color:#b08968;background:#f7f0e8}
.basket .bt{font-family:Fredoka,sans-serif;font-weight:600;font-size:.95em;margin-bottom:.3em;display:flex;align-items:center;justify-content:center;gap:.3em}
.basket.will .bt{color:var(--green2)}
.basket.wont .bt{color:var(--wood2)}
.bitems{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:calc(74px*var(--u))}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:.4em 0;padding:.4em;background:#fbf3df;border:3px solid #e3d3b5;border-radius:16px;min-height:calc(80px*var(--u))}
.obj{width:calc(84px*var(--u));padding:.4em .2em;background:#fff;border:3px solid #e3d3b5;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:.1em;cursor:pointer;font-weight:900;font-size:.72em;color:#5c4a3a;transition:transform .15s,border-color .2s;position:relative}
.obj:active{transform:scale(.94)}
.obj .em{font-size:1.8em;line-height:1.1}
.obj.lit{border-color:var(--gold);box-shadow:0 0 0 3px #fff4d8,0 0 16px rgba(242,193,78,.8)}
.obj.flag{animation:shake .4s}
.obj .fl{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border-radius:50%;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;font-size:.9em;border:2px solid #fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.fade{position:absolute;inset:0;opacity:0;transition:opacity .6s;pointer-events:none}
.fade.on{opacity:1}
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){
  #rotate{display:flex;position:fixed;inset:0;z-index:99;background:#2b2118;color:#fff8ea;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Fredoka,sans-serif;font-size:22px;text-align:center;padding:30px}
  #rotate svg{width:90px;height:90px;animation:rot 2s ease-in-out infinite}
}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (max-height:460px){.dialogue .portrait{width:78px;height:78px}.actions{bottom:118px}}

/* ===== rationing puzzle styles ===== */
/* Puzzle 1 */
.eqbox{background:#fbf3df;border:3px solid #e3d3b5;border-radius:16px;padding:.7em 1em;margin:.5em auto;max-width:460px}
.eqline{font-family:Fredoka,sans-serif;font-weight:600;color:var(--wood2);font-size:1.15em;margin:.25em 0}
.eqline b{color:var(--blue2)}
.eqline.big{font-size:1.5em;color:var(--green2)}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.btn.choice{min-width:calc(90px*var(--u))}
.btn.choice.okpick{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--green),0 8px 18px rgba(0,0,0,.28)}
.scooprow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:.5em 0}

 let ac=null,master=null,muted=false,ambient=null;
 const ensure=()=>{if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);}};
 const noiseBuf=()=>{ensure();const b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};
 let NB=null;
 const tone=(f,t,dur,type='sine',vol=.3,slideTo)=>{if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);};
 const noise=(t,dur,vol=.3,hp=800)=>{if(muted||!ac)return;if(!NB)NB=noiseBuf();const s=ac.createBufferSource();s.buffer=NB;const g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);};
 const api={
  get muted(){return muted;},
  setMuted(m){muted=m;if(master)master.gain.value=m?0:.5;},
  unlock(){ensure();if(ac.state==='suspended')ac.resume();},
  play(name){if(muted)return;ensure();const t=ac.currentTime;switch(name){
   case'tap':tone(420,t,.08,'triangle',.25,620);break;
   case'type':tone(900,t,.025,'square',.05);break;
   case'page':noise(t,.18,.14,1200);tone(300,t,.12,'sine',.1);break;
   case'pour':noise(t,.34,.24,700);tone(170,t,.26,'sine',.12,80);break;
   case'scoop':noise(t,.16,.18,1400);tone(360,t,.1,'triangle',.14,520);break;
   case'grab':noise(t,.08,.12,1800);tone(620,t,.06,'sine',.1,420);break;
   case'good':[523,659,784].forEach((f,i)=>tone(f,t+i*.08,.3,'triangle',.22));break;
   case'win':[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.1,.5,'triangle',.22));noise(t,.3,.1,1500);break;
   case'error':tone(200,t,.25,'sawtooth',.2,120);break;
   case'spark':noise(t,.22,.3,2000);tone(140,t,.18,'sawtooth',.16,70);break;
   case'pop':tone(520,t,.12,'sine',.2,780);break;
   case'chime':tone(880,t,.4,'sine',.18,1320);tone(1320,t+.05,.4,'sine',.1,1760);break;
   case'coin':tone(1046,t,.12,'square',.14,1568);tone(1568,t+.07,.18,'square',.1,2093);break;
   case'xp':tone(740,t,.12,'triangle',.14,1110);break;
   case'achieve':[784,1046,1318,1568].forEach((f,i)=>tone(f,t+i*.09,.4,'triangle',.2));noise(t,.3,.08,1800);break;
   case'thunder':noise(t,.9,.5,60);tone(50,t,.8,'sawtooth',.3,30);break;
  }},
  startAmbient(){ensure();if(ambient||muted)return;ambient=ac.createGain();ambient.gain.value=.03;ambient.connect(master);const o=ac.createOscillator();o.type='sine';o.frequency.value=70;const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.15;lg.gain.value=18;lfo.connect(lg);lg.connect(o.frequency);o.connect(ambient);o.start();lfo.start();}
 };
 return api;
}

  onPause(cb){hud.querySelector('.pause').addEventListener('click',()=>{audio.play('tap');cb();});},
  onNotebook(cb){hud.querySelector('.notebook').addEventListener('click',()=>{audio.play('page');cb();});},

 // mission banner
 const mission=A('div','missionbar',`<span class="micon">${IC('target')}</span><div><small>Objective</small><b class="mtext"></b></div>`);root.appendChild(mission);
 e.mission=(txt)=>{mission.querySelector('.mtext').textContent=txt;mission.classList.add('on','pulse');setTimeout(()=>mission.classList.remove('pulse'),700);};
 e.missionHide=()=>mission.classList.remove('on');

 // markers
 const markers=A('div','markers');root.appendChild(markers);
 e.markers={};
 e.addMarker=(id,label,icon,state,cb)=>{const m=A('button',`marker ${state}`,`<span class="disc">${IC(icon)}<span class="badge">${IC(state==='done'?'check':'lock')}</span></span><span class="lbl">${label}${state==='locked'?' \xB7 soon':''}</span>`);m.addEventListener('click',ev=>{ev.stopPropagation();cb(id);});markers.appendChild(m);e.markers[id]=m;return m;};

 // dialogue
 const dlg=A('div','dialogue',`<div class="portrait"><img alt="Engineer Rio"></div><div class="box panel"><span class="name">Engineer Rio</span><p class="txt"></p><span class="more">tap ▸</span></div>`);
 root.appendChild(dlg);
 const txt=dlg.querySelector('.txt');let typer=null,resolveTap=null,hideT=null;
 e.setPortrait=src=>dlg.querySelector('img').src=src;
 const type=s=>new Promise(res=>{clearInterval(typer);txt.textContent='';let i=0;typer=setInterval(()=>{i++;txt.textContent=s.slice(0,i);if(i%3===0)audio.play('type');if(i>=s.length){clearInterval(typer);typer=null;res();}},22);dlg._finish=()=>{clearInterval(typer);typer=null;txt.textContent=s;res();};});
 dlg.addEventListener('pointerdown',ev=>{ev.stopPropagation();if(typer&&dlg._finish){dlg._finish();return;}if(resolveTap){const r=resolveTap;resolveTap=null;audio.play('tap');r();}});

 e.tell=(s,sec=0)=>{clearTimeout(hideT);resolveTap=null;dlg.classList.add('on');dlg.classList.remove('wait');type(s);if(sec)hideT=setTimeout(()=>dlg.classList.remove('on'),sec*1000);};
 e.hideDialogue=()=>dlg.classList.remove('on','wait');

 // toasts / notebook / achievements
 const toasts=A('div','toasts');root.appendChild(toasts);e._toasts=toasts;
 e.notebook=[];
 e.toast=(t,b,id)=>{const NB=window.RebuildNotebook;if(NB){try{NB.unlock(id);}catch(_){}}e.notebook.push({t,b});audio.play('page');const cnt=NB?`<span class="tcount" style="display:block;margin-top:.2em;font-size:.7em;font-weight:900;color:#b07a14">${NB.count()} / ${NB.total()} parts</span>`:'';const el=A('div','toast panel',`<span class="ticon">${IC('book')}</span><div><small>Notebook part unlocked</small><b>${t}</b><p>${b}</p>${cnt}</div>`);toasts.appendChild(el);setTimeout(()=>el.classList.add('out'),4400);setTimeout(()=>el.remove(),5000);};
 e.achievements=new Set();
 e.achievement=(id,title,sub)=>{if(e.achievements.has(id))return;e.achievements.add(id);audio.play('achieve');e.confetti(50);const el=A('div','toast panel ach',`<span class="ticon trophy">${IC('trophy')}</span><div><small>Achievement unlocked</small><b>${title}</b><p>${sub||''}</p></div>`);toasts.appendChild(el);setTimeout(()=>el.classList.add('out'),3600);setTimeout(()=>el.remove(),4100);};
 e.showNotebook=()=>{const NB=window.RebuildNotebook;const ach=e.achievements.size?`<p class="rnb-ach">${IC('trophy')} Achievements earned: ${e.achievements.size}</p>`:'';if(NB)return e.modal(NB.html('ration')+ach,[{label:'Close'}]);const parts=e.notebook.length?e.notebook.map(p=>`<div class="page"><b>${p.t}</b><p>${p.b}</p></div>`).join(''):'<p>No parts yet. Solve the puzzles to discover the maths!</p>';return e.modal(`<h2>${IC('book')} Engineer’s Notebook</h2><div class="pages">${parts}</div>${ach}`,[{label:'Close'}]);};

 e.burst=(x,y,color='#f0b43a',n=14)=>{for(let i=0;i<n;i++){const s=A('i','spark');const a=rnd(Math.PI*2),d=rnd(70,30);s.style.left=x+'px';s.style.top=y+'px';s.style.background=color;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');root.appendChild(s);setTimeout(()=>s.remove(),700);}};

 // predict + confidence -> resolves {choice, conf}
 e.predict=(question,options,{id,answer,misconceptionId,misconceptionChoice})=>new Promise(res=>{
  const telemetry=window.RebuildTelemetry.prediction(id);
  let choice=-1,conf=-1;
  const optHtml=options.map((o,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="false"><span class="dot"></span><span>${o}</span></button>`).join('');
  const m=A('div','modal',`<div class="card panel"><h2>${IC('help')} Make a prediction</h2><p>${question}</p><div class="opts">${optHtml}</div><div class="conf"><small>How sure are you?</small><div class="cbtns"><button class="cbtn" data-c="0">Not Sure</button><button class="cbtn" data-c="1">A Bit Sure</button><button class="cbtn" data-c="2">Very Sure</button></div></div><div class="row"></div></div>`);
  const confirmBtn=A('button','btn','<span>Confirm prediction</span>');confirmBtn.disabled=true;
  m.querySelector('.row').appendChild(confirmBtn);
  const upd=()=>{confirmBtn.disabled=!(choice>=0&&conf>=0);};
  m.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{audio.play('pop');m.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false');});o.classList.add('sel');o.setAttribute('aria-pressed','true');choice=+o.dataset.i;telemetry.choice(choice);upd();}));
  m.querySelectorAll('.cbtn').forEach(c=>c.addEventListener('click',()=>{audio.play('pop');m.querySelectorAll('.cbtn').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false');});c.classList.add('sel');c.setAttribute('aria-pressed','true');conf=+c.dataset.c;telemetry.confidence(conf+1);upd();}));
  confirmBtn.addEventListener('click',()=>{if(choice<0||conf<0||confirmBtn.disabled)return;confirmBtn.disabled=true;telemetry.confirm(choice,conf+1,answer,misconceptionId,misconceptionChoice);audio.play('tap');m.classList.add('out');setTimeout(()=>m.remove(),250);res({choice,conf});});
  m.addEventListener('pointerdown',ev=>ev.stopPropagation());root.appendChild(m);
 });

 // generic full-screen station overlay
 e.station=(html)=>{const s=A('div','station',`<div class="wrap panel">${html}</div>`);s.addEventListener('pointerdown',ev=>ev.stopPropagation());root.appendChild(s);return {el:s,q:sel=>s.querySelector(sel),qa:sel=>[...s.querySelectorAll(sel)],close(){s.classList.add('out');s.style.transition='opacity .25s';s.style.opacity='0';setTimeout(()=>s.remove(),260);}};};

 // fade
 const fade=A('div','fade');root.appendChild(fade);
 e.fade=(on,color='#07101c')=>new Promise(res=>{fade.style.background=color;fade.classList.toggle('on',on);setTimeout(res,600);});

 return e;
}

/* ========================= textures ========================= */
function tileTex(){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 x.fillStyle='#b5502c';x.fillRect(0,0,256,256);
 const tw=30;
 for(let col=-1;col<256/tw+1;col++){const cx=col*tw;const g=x.createLinearGradient(cx,0,cx+tw,0);g.addColorStop(0,'#9c3f1f');g.addColorStop(.5,'#d06636');g.addColorStop(1,'#9c3f1f');x.fillStyle=g;x.fillRect(cx+1,0,tw-2,256);}
 x.strokeStyle='rgba(70,26,10,.5)';x.lineWidth=2;
 for(let y=0;y<256;y+=34){x.beginPath();x.moveTo(0,y);x.bezierCurveTo(64,y+6,192,y+6,256,y);x.stroke();x.strokeStyle='rgba(255,180,120,.22)';x.beginPath();x.moveTo(0,y+3);x.bezierCurveTo(64,y+9,192,y+9,256,y+3);x.stroke();x.strokeStyle='rgba(70,26,10,.5)';}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}

 const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
 x.fillStyle='#f3e9d2';x.fillRect(0,0,128,128);
 for(let i=0;i<500;i++){x.fillStyle=`rgba(${160+Math.random()*40},${140+Math.random()*40},${100+Math.random()*40},.08)`;x.fillRect(Math.random()*128,Math.random()*128,2,2);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}

 const sw=16;for(let i=0;i<8;i++){x.fillStyle=i%2?a:b;x.fillRect(i*sw,0,sw,16);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;

function sackTex(label){
 const c=document.createElement('canvas');c.width=192;c.height=192;const x=c.getContext('2d');
 x.fillStyle='#cdb183';x.fillRect(0,0,192,192);

 const greyStore=new THREE.Color('#9a968c'),orangeStore=new THREE.Color('#e8893a');
 const darkCloud=new THREE.Color('#2e3642'),whiteCloud=new THREE.Color('#f2f6fb');
 function applyGlow(t){
  glowAmt=t;
  hemi.intensity=0.5+t*0.7;sun.intensity=0.4+t*0.7;fill.intensity=0.2+t*0.3;
  scene.background.copy(nightBG).lerp(brightBG,t);
  scene.fog.color.copy(nightBG).lerp(brightBG,t);
  base.material.color.copy(dimGrass).lerp(baseGrass,t);
  plasterMat.color.copy(greyStore).lerp(orangeStore,t);
  glowInside.emissiveIntensity=.08+t*.5;
  rainMat.opacity=clamp(.55-t*1.3,0,.55);
  cloudMats.forEach(m=>{m.color.copy(darkCloud).lerp(whiteCloud,t);m.opacity=.9-t*.55;});
  moteMat.opacity=.1+t*.4;
  bflies.forEach(b=>b.visible=t>.5);
 }
 applyGlow(0);

 function lightLamp(i){const L=lamps[i];if(!L)return;L.lit=true;L.glassMat.emissiveIntensity=1.3;L.light.intensity=9;}
 function lightHouse(){windowMat.emissiveIntensity=1.1;lamps.forEach((_,i)=>lightLamp(i));glowInside.emissiveIntensity=1;}

 // coin raycast pick (clientX/Y). returns {i,x,y} of the collected coin or null
 function pickCoin(cx,cy){
  const nx=(cx/innerWidth)*2-1,ny=-(cy/innerHeight)*2+1;ray.setFromCamera({x:nx,y:ny},camera);
  const live=coins.filter(c=>!c.userData.collected);const hit=ray.intersectObjects(live,false);
  if(hit.length){const coin=hit[0].object;coin.userData.collected=true;
   const v=coin.position.clone().project(camera);const sx=(v.x*.5+.5)*innerWidth,sy=(-v.y*.5+.5)*innerHeight;
   return {coin,x:sx,y:sy};}
  return null;
 }
 let lightningT=0,flashAmt=0,onThunder=null;
 function update(dt){
  const tt=performance.now()/1000;
  camera.position.x=10+Math.sin(tt*0.12)*0.9;
  camera.position.y=8+Math.sin(tt*0.09)*0.3;
  camera.lookAt(0.3,2,0.5);
  lamps.forEach(L=>{if(L.lit)L.light.intensity=8+Math.sin(tt*9+L.light.position.x)*1.4;});
  buntGroup.children.forEach((f,i)=>{f.rotation.z=Math.sin(tt*2+i)*0.12;});
  // clouds drift
  cloudGrp.children.forEach(cg=>{cg.position.x+=cg.userData.sp*dt;if(cg.position.x>14)cg.position.x=-14;});
  // rain fall
  if(rainMat.opacity>0.01){const p=rainGeo.attributes.position.array;for(let i=0;i<RAIN;i++){let y=p[i*6+1]-rvel[i]*dt;let yb=p[i*6+4]-rvel[i]*dt;if(yb<0){const nx=rnd(16,-16),nz=rnd(13,-9);y=rnd(20,14);yb=y-.7;p[i*6]=nx;p[i*6+2]=nz;p[i*6+3]=nx+.1;p[i*6+5]=nz;}p[i*6+1]=y;p[i*6+4]=yb;}rainGeo.attributes.position.needsUpdate=true;}
  // motes drift
  const mp=moteGeo.attributes.position.array;for(let i=0;i<MOTE;i++){mp[i*3+1]+=Math.sin(tt*.5+mph[i])*dt*.15+dt*.05;mp[i*3]+=Math.cos(tt*.3+mph[i])*dt*.1;if(mp[i*3+1]>9)mp[i*3+1]=.5;}moteGeo.attributes.position.needsUpdate=true;
  // smoke rise
  smoke.forEach(p=>{p.userData.t+=dt*p.userData.sp;if(p.userData.t>1)p.userData.t-=1;const u=p.userData.t;p.position.y=8.2+u*3.2;p.position.x=2.5+Math.sin(u*6+p.userData.sp*10)*.3;p.scale.setScalar(.5+u*2);p.material.opacity=(1-u)*(0.22+(1-glowAmt)*0.25);});
  // butterflies
  bflies.forEach(b=>{if(!b.visible)return;const u=b.userData;u.ph+=dt*1.2;b.position.set(u.cx+Math.cos(u.ph)*u.r,u.h+Math.sin(u.ph*2)*.5,u.cz+Math.sin(u.ph)*u.r);const flap=Math.sin(tt*18+u.ph)*0.9;u.wl.rotation.y=flap;u.wr.rotation.y=-flap;b.rotation.y=-u.ph;});
  // chickens peck/hop
  chickens.forEach(c=>{const u=c.userData;u.ph+=dt;const hop=Math.max(0,Math.sin(u.ph*3))*.12;c.position.y=hop;c.position.z=u.base+Math.sin(u.ph*.4)*.6;u.head.rotation.x=Math.max(0,Math.sin(u.ph*2.3))*.9;c.rotation.y=Math.sin(u.ph*.4)*.5*u.dir;});
  // coins spin/bob
  coins.forEach(c=>{if(c.userData.collected){if(c.visible){c.scale.multiplyScalar(0.82);if(c.scale.x<.05)c.visible=false;}return;}c.rotation.z+=dt*2.2;c.position.y=c.userData.base+Math.sin(tt*2+c.userData.ph)*.12;c.userData.mat.emissiveIntensity=.6+Math.sin(tt*4+c.userData.ph)*.3;});
  // lightning during storm
  if(glowAmt<0.34){lightningT-=dt;if(lightningT<=0){lightningT=rnd(7,3);flashAmt=1;onThunder&&onThunder();}}
  if(flashAmt>0){flashAmt=Math.max(0,flashAmt-dt*3);hemi.intensity=(0.5+glowAmt*0.7)+flashAmt*1.6;scene.background.copy(nightBG).lerp(brightBG,glowAmt).lerp(new THREE.Color('#cfe0ee'),flashAmt*.5);}
 }
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}

 return {scene,camera,update,resize,anchors,applyGlow,lightLamp,lightHouse,getGlow:()=>glowAmt,pickCoin,coinCount:coins.length,setThunder:fn=>onThunder=fn};
}

/* ========================= Puzzle 1: the missing ration (drag scoops) ========================= */
function runMissingRation(ie,audio){
 return new Promise(resolve=>{
  const TOTAL=144,FAM=6,SHARE=24;
  const baskets=Array(FAM).fill(0);
  const sv=ie.station(`
   <h3>${IC('sack')} Puzzle 1 — The Missing Ration</h3>
   <p class="sub">The store holds <b>${TOTAL} kg</b> of grain for <b>${FAM} families</b>. Each share is unknown — call it <b>x</b>.</p>
   <div id="p1body"></div>`);
  const body=()=>sv.q('#p1body');

  function renderSolve(){
   body().innerHTML=`
    <div class="eqbox">
      <div class="eqline">x + x + x + x + x + x &nbsp;=&nbsp; <b>6x</b></div>
      <div class="eqline big">6 × x = ${TOTAL}</div>
      <div class="eqline">x = ${TOTAL} ÷ 6 = <b>?</b></div>
    </div>
    <p class="sub">Tap the correct value of <b>x</b> (each family’s share).</p>
    <div class="choices"></div>
    <p class="msg" id="m1">Divide the grain equally among the six families.</p>`;
   const cw=body().querySelector('.choices');
   [18,22,24,30].forEach(v=>{const b=A('button','btn gold choice',`<span>${v} kg</span>`);
    b.addEventListener('click',()=>{audio.play('tap');
     if(v===SHARE){audio.play('good');const m=body().querySelector('#m1');m.textContent='Yes! 6 × 24 = 144, so x = 24 kg for each family.';m.className='msg ok';cw.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('okpick');setTimeout(renderDistribute,1200);}
     else{audio.play('error');const m=body().querySelector('#m1');m.textContent='Not quite — work out 144 ÷ 6 again.';m.className='msg bad';b.disabled=true;}
    });cw.appendChild(b);});
  }
  function renderDistribute(){
   body().innerHTML=`
    <p class="sub"><b>Drag the 24 kg scoop</b> onto each family’s basket until all six have their share. (You can also tap a basket.)</p>
    <div class="scooprow"><div class="scoop" id="scoop" title="Drag me">${IC('sack')}<span>24 kg scoop</span></div><div class="disttotal">Distributed: <b id="dt">0</b> / ${TOTAL} kg</div></div>
    <div class="rbaskets"></div>
    <p class="msg" id="m1b">Six families, 24 kg each.</p>`;
   const rb=body().querySelector('.rbaskets');
   for(let i=0;i<FAM;i++){const bk=A('button','rbasket',`<div class="rbfill"></div><div class="rblabel">${IC('basket')} Family ${i+1}</div><div class="rbkg">0 kg</div>`);bk.dataset.drop='1';bk.dataset.i=i;bk.addEventListener('click',()=>addScoop(i,bk));rb.appendChild(bk);}
   const scoop=body().querySelector('#scoop');
   scoop.addEventListener('pointerdown',ev=>{audio.play('grab');startDrag(ev,scoop,(target)=>{if(target&&target.classList.contains('rbasket')){addScoop(+target.dataset.i,target,ev);}});});
  }
  function addScoop(i,bk,ev){
   if(baskets[i]>=SHARE){audio.play('error');bk.classList.add('shake');setTimeout(()=>bk.classList.remove('shake'),400);return;}
   baskets[i]=SHARE;audio.play('pour');
   bk.querySelector('.rbfill').style.height='100%';bk.querySelector('.rbkg').textContent=SHARE+' kg';bk.classList.add('full');
   const r=bk.getBoundingClientRect();ie.burst(r.left+r.width/2,r.top+r.height*.4,'#e8c24a',12);
   const total=baskets.reduce((a,b)=>a+b,0);body().querySelector('#dt').textContent=total;
   if(total===TOTAL){audio.play('win');ie.confetti(40);const m=body().querySelector('#m1b');m.textContent='All six families have an equal 24 kg share — fair and complete!';m.className='msg ok';setTimeout(()=>{sv.close();resolve(true);},1500);}
  }
  renderSolve();
 });
}

  const barA=sv.q('#barA'),barB=sv.q('#barB'),msg=sv.q('#m2');
  barA.innerHTML='<div class="fpiece whole">1 whole block</div>';barB.innerHTML='<div class="fpiece whole">1 whole block</div>';
  function cut(bar,n,color){bar.innerHTML='';for(let i=0;i<n;i++){const p=A('div','fpiece cutin',`1/${n}`);p.style.flex='1';p.style.background=color;p.style.animationDelay=(i*60)+'ms';bar.appendChild(p);}}
  const panW={L:null,R:null};
  function place(side,f,label){const pan=sv.q(side==='L'?'#panL':'#panR');pan.querySelector('.panin').innerHTML=`<span class="pp ${f===0.25?'q':'e'}">${label}</span>`;panW[side]=f;audio.play('pop');
   // remove from the other pan if same piece was there
   const other=side==='L'?'R':'L';if(panW[other]===f){panW[other]=null;sv.q(other==='L'?'#panL':'#panR').querySelector('.panin').innerHTML='';}
   const pcQ=sv.q('#pcQ'),pcE=sv.q('#pcE');pcQ.style.visibility=(panW.L===0.25||panW.R===0.25)?'hidden':'visible';pcE.style.visibility=(panW.L===0.125||panW.R===0.125)?'hidden':'visible';
   if(panW.L!=null&&panW.R!=null)tip();
  }
  function tip(){const beam=sv.q('#beam');const diff=panW.L-panW.R;const ang=diff>0?-13:13;beam.style.transform=`rotate(${ang}deg)`;sv.qa('.panin .pp').forEach(p=>p.style.transform=`rotate(${-ang}deg)`);
   audio.play('good');ie.burst(innerWidth/2,innerHeight*0.42,'#6cc544',14);
   msg.innerHTML='The heavier pan drops — <b>1/4 is bigger than 1/8</b>, even though 8 is more than 4.';msg.className='msg ok';

  sv.q('#cut').addEventListener('click',()=>{cut(barA,4,'#6cc544');cut(barB,8,'#4aa3e0');audio.play('page');msg.textContent='Now drag one piece of each onto the balance pans.';sv.q('#cut').disabled=true;sv.q('#cut').style.display='none';sv.q('#balwrap').style.display='block';});

/* ========================= Puzzle 3: the five-day plan ========================= */
function runFiveDayChallenge(ie,audio){
 return new Promise(resolve=>{
  const TOTAL=210,DAYS=5,ANS=42;
  let daily=30,running=false;
  const sv=ie.station(`
   <h3>${IC('calendar')} Puzzle 3 — The Five-Day Plan</h3>
   <p class="sub"><b>${TOTAL} kg</b> of emergency grain must last <b>${DAYS} days</b>. Using x kg each day: x+x+x+x+x = <b>5x</b>, so <b>5x = ${TOTAL}</b>.</p>
   <div class="stockwrap"><div class="stocklbl">Grain stock</div><div class="stockbar"><i id="stockfill" style="width:100%"></i><span id="stocktxt">${TOTAL} kg</span></div></div>
   <div class="calrow" id="calrow"></div>
   <div class="sliderwrap">
     <div class="sliderval">Daily ration: <b id="dval">${daily}</b> kg/day</div>
     <input type="range" min="20" max="70" step="1" value="${daily}" id="slider" class="rslider">
     <div class="slidermark">Slide to find x so that 5 × x = ${TOTAL}</div>
   </div>
   <p class="msg" id="m3">Set a daily amount, then press “Run the week”.</p>
   <div class="brow"><button class="btn blue" id="runwk">${IC('calendar')}<span>Run the week</span></button><button class="btn orange" id="p3done" disabled>${IC('check')}<span>Continue</span></button></div>`);
  const calrow=sv.q('#calrow');for(let d=0;d<DAYS;d++){calrow.appendChild(A('div','calday',`<small>Day ${d+1}</small><b>—</b>`));}
  const slider=sv.q('#slider'),dval=sv.q('#dval'),msg=sv.q('#m3'),stockfill=sv.q('#stockfill'),stocktxt=sv.q('#stocktxt'),p3done=sv.q('#p3done'),runBtn=sv.q('#runwk');
  function resetCal(){stockfill.style.width='100%';stockfill.className='';stocktxt.textContent=TOTAL+' kg';calrow.querySelectorAll('.calday').forEach(c=>{c.className='calday';c.querySelector('b').textContent='—';});p3done.disabled=true;}
  slider.addEventListener('input',()=>{daily=+slider.value;dval.textContent=daily;if(!running)resetCal();});
  runBtn.addEventListener('click',async()=>{
   if(running)return;running=true;runBtn.disabled=true;slider.disabled=true;resetCal();
   let stock=TOTAL;const cells=[...calrow.querySelectorAll('.calday')];let failDay=-1;
   for(let d=0;d<DAYS;d++){await wait(520);const give=Math.min(daily,stock);stock-=give;const cell=cells[d];cell.querySelector('b').textContent=give+' kg';stockfill.style.width=(stock/TOTAL*100)+'%';stocktxt.textContent=stock+' kg';
    if(give<daily){cell.classList.add('bad');if(failDay<0)failDay=d;audio.play('error');stockfill.className='empty';}else{cell.classList.add('fed');audio.play('pop');}}
   await wait(420);
   if(daily===ANS&&stock===0){msg.textContent=`Perfect! ${ANS} kg × 5 days = ${TOTAL} kg. Every day is fed and nothing is wasted.`;msg.className='msg ok';audio.play('win');ie.confetti(40);p3done.disabled=false;}
   else if(failDay>=0){msg.textContent=`Too much! At ${daily} kg/day the grain runs out on Day ${failDay+1}. Lower the daily ration.`;msg.className='msg bad';audio.play('spark');}
   else{msg.textContent=`${stock} kg left unused — ${daily} kg/day is too little. Raise it so nothing is wasted.`;msg.className='msg bad';}
   running=false;runBtn.disabled=false;slider.disabled=false;
  });
  p3done.addEventListener('click',()=>{sv.close();resolve(true);});
 });
}

   <div class="rbaskets five" id="rb5"></div>
   <p class="msg" id="mr">23 ÷ 5 = ? Deal the grain and watch the remainder.</p>
   <div class="brow"><button class="btn blue" id="deal">${IC('hand')}<span>Deal a round (5 kg)</span></button><button class="btn orange" id="rdone" disabled>${IC('check')}<span>Continue</span></button></div>`);
  const rb=sv.q('#rb5');
  for(let i=0;i<FAM;i++){rb.appendChild(A('div','rbasket mini',`<div class="rbfill"></div><div class="rblabel">${IC('basket')} Fam ${i+1}</div><div class="rbkg">0 kg</div>`));}
  const cells=[...rb.querySelectorAll('.rbasket')];
  sv.q('#deal').addEventListener('click',()=>{
   if(left<FAM){return;}
   for(let i=0;i<FAM;i++){share[i]++;cells[i].querySelector('.rbkg').textContent=share[i]+' kg';cells[i].querySelector('.rbfill').style.height=(share[i]/5*100)+'%';}
   left-=FAM;sv.q('#leftkg').textContent=left;audio.play('scoop');
   const r=sv.q('.pilebox').getBoundingClientRect();ie.burst(r.left+r.width/2,r.top+r.height/2,'#e8c24a',10);
   if(left<FAM){sv.q('#deal').disabled=true;audio.play('win');ie.confetti(40);
    sv.q('#mr').innerHTML=`<b>23 ÷ 5 = 4 remainder ${left}</b> — each family gets <b>4 kg</b>, and <b>${left} kg</b> are left over.`;sv.q('#mr').className='msg ok';
    sv.q('#leftkg').parentElement.classList.add('rem');sv.q('#rdone').disabled=false;}
  });
  sv.q('#rdone').addEventListener('click',()=>{sv.close();resolve(true);});
 });
}

/* ========================= module flow ========================= */
function startGame(ie,audio,village){
 const S={done:[false,false,false],busy:false};
 const puzzleTitles=['Missing ration','Unequal portions','Five-day plan'];
 const hints=[
  'Puzzle 1: There are 6 equal shares, so write 6x = 144. Find x by dividing: 144 ÷ 6 = 24. Then drag a 24 kg scoop into each basket.',
  'Puzzle 2: Cut both equal blocks, then drag one piece of each onto the balance. The bigger piece (1/4) tips the scale down. Also 1/2 = 2/4 = 4/8.',
  'Puzzle 3: Five equal days, so 5x = 210. Divide: 210 ÷ 5 = 42 kg/day. Slide to 42 and run the week.'
 ];

 const project=()=>{
  if(!village)return;
  for(const id of['p1','p2','p3']){const m=ie.markers[id];if(!m)continue;const v=village.anchors[id].clone();v.project(village.camera);const x=(v.x*.5+.5)*innerWidth,y=(-v.y*.5+.5)*innerHeight;const behind=v.z>1;m.style.display=behind?'none':'';m.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;}
 };
 village._project=project;
 village.setThunder(()=>audio.play('thunder'));

 // coins collection
 let coinsGot=0;
 village._onCanvas=(cx,cy)=>{if(S.busy)return;const hit=village.pickCoin(cx,cy);if(hit){coinsGot++;ie.hud.setCoins(coinsGot);ie.burst(hit.x,hit.y,'#ffcf3f',16);audio.play('coin');ie.addXP(15,hit.x,hit.y);
   if(coinsGot>=village.coinCount){ie.achievement('treasure','Treasure Hunter!','You found all 5 hidden grain-coins.');ie.addXP(50);}
   else ie.tell(`Grain-coin found! ${coinsGot} of ${village.coinCount}.`,1.8);}};

 ie.hud.onHelp(async()=>{const cur=S.done.findIndex(d=>!d);const i=cur<0?2:cur;await ie.modal(`<h2>${IC('help')} Ask Rio</h2><p style="text-align:left">${hints[i]}</p><p style="text-align:left;font-size:.85em;color:#5c4a3a">Tip: look around the market for 5 hidden glowing grain-coins — tap them for bonus XP!</p>`,[{label:'Got it',icon:'check'}]);});

 async function appCards(){
  await ie.modal(`<h2>${IC('wheat')} Maths in real life</h2>
   <div class="pages">
    <div class="page"><b>Fair ration distribution</b><p>Sharing a fixed amount equally uses division: total ÷ number of families. Writing the share as x and solving 6x = total makes sure every family gets the same.</p></div>
    <div class="page"><b>Planning supplies to last</b><p>To make a supply last, divide it by the number of days. An equation like 5x = 210 gives the daily amount x, so nothing runs out early or is wasted.</p></div>
   </div>`,[{label:'Close'}]);
 }

 async function intro(){
  ie.hud.show(true);ie.hud.backVisible(true);
  await ie.say([
   'Namaste! I’m Rio, the village engineer. A fierce storm has struck Palampur and washed out the road.',
   'The supply truck cannot reach us for five days. Our grain store is the only food for six families now.',
   'Worse — the storm damaged our grain records. We don’t know each family’s share, or how long the stock will last.',
   'Will you be my Village Mathematics Engineer? Solve the problems to calm the storm — and tap any glowing grain-coins you spot for bonus XP.'
  ]);
  await ie.modal(`<h2>${IC('book')} The council’s three worries</h2>
   <div class="pages">
     <div class="page"><b>1 · The missing ration</b><p>Divide the grain equally among the six families.</p></div>
     <div class="page"><b>2 · Unequal portions</b><p>Compare fractions so no one is treated unfairly.</p></div>
     <div class="page"><b>3 · The five-day plan</b><p>Make the emergency grain last until the road reopens.</p></div>
   </div>
   <p style="font-size:.9em;color:#5c4a3a">We’ll solve them with variables, expressions, simple equations and fractions.</p>`,
   [{label:'Let’s help Palampur',icon:'check',color:'gold'}]);
  audio.play('good');
  ie.hideDialogue();
  ie.markersVisible(true);
  ie.addMarker('p1','Missing ration','sack','open',openPuzzle);
  ie.addMarker('p2','Unequal portions','divide','locked',openPuzzle);
  ie.addMarker('p3','Five-day plan','calendar','locked',openPuzzle);
  ie.hud.steps(puzzleTitles,0);
  ie.mission('Tap the glowing grain store to solve the missing ration');
 }

 async function openPuzzle(id){
  if(S.busy)return;
  const idx={p1:0,p2:1,p3:2}[id];
  if(idx>0&&!S.done[idx-1]){ie.tell('Finish the earlier problem first!',2.5);audio.play('error');return;}
  if(S.done[idx]){ie.tell('You already solved this one!',2);return;}
  S.busy=true;ie.markersVisible(false);ie.hideDialogue();

  if(idx===0){
   ie.tell('144 kg, six families. Find each equal share, then share it out.',0);
   await wait(400);
   await runMissingRation(ie,audio);
   ie.toast('A letter stands for a number','x is an unknown number. x added six times is 6x, and 6x = 144 gives x = 24 by dividing. Each family gets 24 kg.','ration.variable');
   ie.achievement('fair','Fair Share!','Every family got an equal 24 kg.');
  }else if(idx===1){
   const p=await ie.predict('Which is bigger — 1/4 or 1/8?',['1/4 is bigger','1/8 is bigger','They are equal'],{id:'fraction-size',answer:0,misconceptionId:'bigger_denominator_bigger',misconceptionChoice:1});
   await runFractionCompare(ie,audio);
   if(p.choice===1){await ie.say(['A lovely surprise! Many people guess 1/8 because 8 is bigger than 4. But more pieces means each one is smaller — so 1/4 wins.']);ie.hideDialogue();}
   ie.toast('More pieces, smaller parts','Fractions are equal parts of a whole. Splitting the same block into more pieces makes each piece smaller, so 1/4 > 1/8. And 1/2 = 2/4 = 4/8.','ration.fractions');
   ie.achievement('fraction','Fraction Master!','You compared fractions on the balance.');
  }else{
   ie.tell('210 kg must last five days. Slide to find the daily amount, then run the week.',0);
   await wait(400);
   await runFiveDayChallenge(ie,audio);
   ie.toast('An equation plans a resource','Using x kg a day for 5 days is 5x. Since 5x = 210, dividing gives x = 42 kg/day — just enough to last the whole week.','ration.equation');
   ie.achievement('planner','Supply Planner!','You made the grain last exactly five days.');
  }

  S.done[idx]=true;S.busy=false;
  ie.setMarkerState(id,'done');
  village.lightLamp(idx);
  const solved=S.done.filter(Boolean).length;
  village.applyGlow(Math.min(0.55,0.2*solved));
  ie.hud.setProgress(solved);
  ie.addXP(100);
  ie.markersVisible(true);
  const nextIdx=idx+1;
  if(nextIdx<3){ie.setMarkerState(['p1','p2','p3'][nextIdx],'open',puzzleTitles[nextIdx]);ie.hud.steps(puzzleTitles,nextIdx);
   ie.mission(['','Compare the family portions at the scales','Plan the five-day grain supply'][nextIdx]);
   await ie.say(['Wonderful work! The storm is easing and a lantern glowed to life. Tap the next glowing spot.']);ie.hideDialogue();
  }else{ie.hud.steps(puzzleTitles,3);ie.missionHide();await ending();}
 }

 async function ending(){
  ie.markersVisible(false);ie.hideDialogue();
  await ie.say(['All three problems solved! Step back and watch the sky clear over the grain store.']);
  await ie.fade(true,'#07101c');
  const start=performance.now();const g0=village.getGlow();
  await new Promise(res=>{const an=()=>{const t=clamp((performance.now()-start)/2200,0,1);village.applyGlow(g0+(1-g0)*t);if(t<1)requestAnimationFrame(an);else res();};an();});
  village.lightHouse();audio.play('win');ie.confetti(120);
  await ie.fade(false,'#07101c');
  ie.achievement('hero','Village Hero!','You brought a fair food plan back to Palampur.');ie.addXP(150);
  await ie.say(['Look — the storm has passed, the grey grain store has turned a warm orange, and the lanterns are glowing!','You shared food for six families with mathematics. Let’s do a quick Village Check-up — three hands-on challenges.']);
  ie.hideDialogue();
  await checkup();
 }

 async function checkup(){
  let stars=0;
  await challengeExpr(ie,audio);stars++;ie.addXP(40);
  await challengeBigger(ie,audio);stars++;ie.addXP(40);
  await challengeRemainder(ie,audio);stars++;ie.addXP(40);
  window.RebuildTelemetry.complete();
  const starHtml=[0,1,2].map(i=>`<svg class="ic ${i<stars?'':'off'}" viewBox="0 0 24 24">${ICONS.star}</svg>`).join('');
  const r=await ie.modal(`<h2>${IC('trophy')} Village Check-up complete!</h2><div class="stars">${starHtml}</div><p>All three challenges done! You brought a fair food plan back to Palampur.</p>
   ${(()=>{const NB=window.RebuildNotebook;return NB?`<p class="rnb-summary">Notebook: ${NB.count('ration')} / ${NB.total('ration')} parts unlocked in this module · ${NB.count()} / ${NB.total()} overall</p>`:'';})()}
   <div class="pages">
    <div class="page"><b>Unknowns & expressions</b><p>A letter like x stands for a number; x+x+x = 3x.</p></div>
    <div class="page"><b>Simple equations</b><p>6x = 144 gives x = 24; 5x = 210 gives x = 42.</p></div>
    <div class="page"><b>Comparing fractions</b><p>More equal pieces are smaller, so 1/4 > 1/8.</p></div>
    <div class="page"><b>Sharing with a remainder</b><p>23 ÷ 5 = 4 remainder 3.</p></div>
   </div>
   <p style="font-weight:900;color:var(--green2)">${IC('coin')} Grain-coins found: ${coinsGot} / ${village.coinCount} · ${IC('trophy')} Achievements: ${ie.achievements.size}</p>`,
   (()=>{const a=[{label:'Real-life cards',icon:'wheat',color:'gold'}];if(window.RebuildJourney&&window.RebuildJourney.active)a.push({label:window.RebuildJourney.nextLabel,icon:'play',color:'gold'});a.push({label:'Play again',icon:'restart',color:'orange'});return a;})());
  if(r===0){await appCards();location.reload();return;}
  if(window.RebuildJourney&&window.RebuildJourney.active&&r===1){window.RebuildJourney.complete();return;}
  location.reload();
 }

 return {intro};
}

/* ========================= bootstrap ========================= */
const canvas=document.getElementById('c');
const Cn=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
Cn.setPixelRatio(Math.min(devicePixelRatio,1.5));
Cn.setSize(innerWidth,innerHeight);
Cn.shadowMap.enabled=true;Cn.shadowMap.type=THREE.PCFShadowMap;
Cn.toneMapping=THREE.ACESFilmicToneMapping;Cn.toneMappingExposure=1.05;
Cn.outputColorSpace=THREE.SRGBColorSpace;

const audio=makeAudio();
const ie=buildUI(audio);
let village=null,game=null,paused=false,last=performance.now();

async function boot(){
 ie.title.progress(.25,'Raising the awning…');await wait(60);
 village=buildMarket(Cn);
 ie.title.progress(.7,'Stacking the grain sacks…');await wait(60);
 ie.setPortrait(makePortrait());
 ie.title.progress(1,'Ready!');ie.title.ready();
}
async function startModule(){
 ie.title.hide();audio.startAmbient();
 ie.hud.show(true);ie.showStats();
 game=startGame(ie,audio,village);
 await ie.fade(false);
 game.intro();
}
ie.title.onStart(startModule);
ie.hud.onBack(async()=>{if(await ie.modal('<h2>Restart module?</h2><p>Your progress will be lost.</p>',[{label:'Keep playing'},{label:'Restart',color:'orange'}])===1)location.reload();});
ie.hud.onPause(async()=>{paused=true;const r=await ie.modal('<h2>Paused</h2>',[{label:'Resume',icon:'play'},{label:'Restart',icon:'restart',color:'orange'}]);paused=false;if(r===1)location.reload();});
ie.hud.onNotebook(()=>ie.showNotebook());

// canvas tap -> try to collect a grain-coin
canvas.addEventListener('pointerdown',ev=>{if(village&&village._onCanvas)village._onCanvas(ev.clientX,ev.clientY);});

addEventListener('resize',()=>{Cn.setSize(innerWidth,innerHeight);village&&village.resize();});

function loop(now){
 requestAnimationFrame(loop);
 let dt=Math.min((now-last)/1000,.05);last=now;if(paused)dt=0;
 if(village){village.update(dt);village._project&&village._project();Cn.render(village.scene,village.camera);}
}
requestAnimationFrame(loop);
boot();
</script>
</body>
