<html lang="en"><head>

<style>
  /* Layout: full-bleed WebGL canvas of a rotating storybook village planet; click to zoom in. Quiet overlay wordmark, hint, and a Back control. Single committed warm-storybook look matched to the Educational Village renders. */
  :root{
    --sky-top:#ffffff; --sky-warm:#f4f6f7;
    --ink:#2b2117; --paper:#fbf4e6;
    --pill:rgba(28,22,15,.48); --pill-fg:#fff6e6; --accent:#bf5a34;
    color-scheme: light;
  }
  html,body{height:100%}
  body{
    margin:0; background:linear-gradient(180deg,var(--sky-top),var(--sky-warm));
    font-family:"Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink);
    overflow:hidden;
  }
  #stage{position:fixed; inset:0; display:block; touch-action:none; cursor:grab;filter:saturate(1.18) contrast(1.06)}
  #stage.drag{cursor:grabbing}
  #stage.zoom{cursor:default}
  .title-screen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .75s ease,transform 1.05s cubic-bezier(.2,.8,.2,1)}
  .title-screen::before{content:"";position:absolute;inset:0;background:radial-gradient(65% 58% at 50% 34%,rgba(255,255,255,.02),rgba(255,255,255,0) 64%),linear-gradient(180deg,rgba(24,30,36,.12),rgba(16,22,28,.28));pointer-events:none}
  .title-screen.out{opacity:0;transform:scale(1.04);pointer-events:none}
  .title-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vw,18px);text-align:center;padding:20px;z-index:1}
  .logo{display:flex;gap:.02em;font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(74px,12vw,128px);line-height:.95;letter-spacing:.02em;filter:drop-shadow(0 3px 2px rgba(255,230,150,.45))}
  .logo span{display:inline-block;color:#ffd83d;-webkit-text-fill-color:#ffd83d;-webkit-text-stroke:clamp(3px,.45vw,5px) #6b2a12;paint-order:stroke fill;text-shadow:0 clamp(5px,.7vw,8px) 0 #9a430d,0 clamp(10px,1.4vw,16px) clamp(20px,2.7vw,30px) rgba(0,0,0,.58),0 0 clamp(24px,3.2vw,36px) rgba(255,196,28,.82);animation:logoBob 2.6s ease-in-out infinite}
  .logo span:nth-child(2n){color:#ffc928;-webkit-text-fill-color:#ffc928}
  .logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}.logo span:nth-child(5){animation-delay:.48s}.logo span:nth-child(6){animation-delay:.6s}.logo span:nth-child(7){animation-delay:.72s}
  @keyframes logoBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
  .tagline{margin:0;color:#fff;font-weight:900;font-size:clamp(16px,2.2vw,22px);letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.65),0 0 24px rgba(120,190,255,.25)}
  .start-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;cursor:pointer;font:700 clamp(22px,3vw,30px) "Fredoka",sans-serif;color:#fff;padding:.55em 1.6em;border-radius:999px;background:linear-gradient(180deg,#91e85e,#59bd32 54%,#2f811b);border-bottom:6px solid #286d18;text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 10px 24px rgba(0,0,0,.3),0 0 0 0 rgba(116,235,72,.62),0 0 28px rgba(116,235,72,.5),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.18);transition:transform .16s ease,filter .2s ease;pointer-events:auto;min-width:min(360px,82vw);overflow:hidden;animation:ctaGlow 1.8s ease-in-out infinite}
  .start-btn::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-45%;width:28%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.72),rgba(255,255,255,0));transform:skewX(-20deg);animation:ctaSheen 2.8s ease-in-out infinite;pointer-events:none}
  .start-btn.starting{animation:ctaLaunch .7s ease-in-out infinite alternate;pointer-events:none}
  @keyframes ctaGlow{0%,100%{box-shadow:0 10px 24px rgba(0,0,0,.3),0 0 0 0 rgba(116,235,72,.55),0 0 24px rgba(116,235,72,.46),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.18)}50%{box-shadow:0 12px 28px rgba(0,0,0,.32),0 0 0 12px rgba(116,235,72,0),0 0 42px rgba(116,235,72,.8),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.16)}}
  @keyframes ctaSheen{0%,58%{left:-45%;opacity:0}68%{opacity:1}88%,100%{left:118%;opacity:0}}
  @keyframes ctaLaunch{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.18);transform:scale(1.025)}}
  .play-icon,.sound-icon{width:1.08em;height:1.08em;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .start-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.start-btn:active{transform:translateY(3px);border-bottom-width:3px}
  .hint{margin:0;display:flex;align-items:center;gap:.4em;color:#fff;font-weight:800;font-size:clamp(12px,1.45vw,16px);text-shadow:0 1px 4px rgba(0,0,0,.6);transition:opacity .65s ease}
  .chips{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;gap:8px;z-index:6;transition:opacity .65s ease}
  .chips span{background:linear-gradient(180deg,rgba(255,252,244,.97),rgba(246,230,196,.94));color:var(--ink);font-weight:900;font-size:clamp(11px,1.2vw,15px);padding:.45em .9em;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 #fff;border:1px solid rgba(122,78,45,.25);white-space:nowrap}
  .journey-link{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:6;display:inline-flex;align-items:center;min-height:38px;padding:0 .9em;border:2px solid rgba(122,78,45,.28);border-radius:999px;color:var(--ink);background:linear-gradient(180deg,rgba(255,252,244,.97),rgba(246,230,196,.94));box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 1px #fff;font:900 clamp(11px,1.2vw,14px) Nunito,sans-serif;text-decoration:none;transition:transform .16s ease,filter .16s ease}.journey-link:hover{transform:translateY(-2px);filter:brightness(1.04)}
  @media (max-width:620px){.chips{flex-wrap:wrap;max-width:90vw}.tagline{max-width:88vw}.start-btn{min-width:0}.logo{font-size:clamp(62px,16vw,92px)}}
  .fallback{
    position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px;
    z-index:9; background:linear-gradient(180deg,var(--sky-top),var(--sky-warm));
  }
  .fallback div{max-width:380px; color:var(--ink); font-size:15px; line-height:1.5}
  #villageFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .55s ease;background:#d9ebfa}
  #villageFrame.open{opacity:1;pointer-events:auto}
  .journey-open .chips,.journey-open .journey-link{visibility:hidden}
  #loadStatus{font-weight:850;color:#fff;text-shadow:0 1px 5px #281905;min-height:1.25em}
  #loadStatus:empty{display:none}
  @media (prefers-reduced-motion:reduce){.logo span,.start-btn,.start-btn::after,.start-btn.starting{animation:none}.title-screen{transition:none}.hint{opacity:.85}#villageFrame{transition-duration:.12s}}
</style>

  .nb-fab{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;display:inline-flex;align-items:center;gap:.5em;min-height:46px;padding:0 18px;border:3px solid #7a4e2d;border-radius:999px;background:linear-gradient(180deg,#fffdf8,#f6e6c4);color:#2b2117;font:900 15px Nunito,sans-serif;cursor:pointer;box-shadow:0 6px 16px rgba(20,12,4,.3),inset 0 1px #fff;transition:transform .16s ease,filter .16s ease}

  .nb-ov.on{display:flex}
  .nb-card{position:relative;margin:auto;width:min(560px,100%);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#fffdf7,#f6e6c4);border:4px solid #7a4e2d;border-radius:22px;padding:22px;box-shadow:0 18px 40px rgba(20,12,4,.4)}
  .nb-close{margin-top:16px;min-height:46px;width:100%;border:3px solid #2f6e1c;border-radius:999px;background:linear-gradient(180deg,#7bd451,#55ad32 52%,#2f6e1c);color:#fff;font:600 18px Fredoka,sans-serif;cursor:pointer}

<script>(function(){var NB=window.RebuildNotebook,ov=document.getElementById('nbOv');function open(){if(NB)document.getElementById('nbBody').innerHTML=NB.html('water');ov.classList.add('on');}function close(){ov.classList.remove('on');}var f=document.getElementById('nbFab');if(f)f.addEventListener('click',open);var c=document.getElementById('nbClose');if(c)c.addEventListener('click',close);ov.addEventListener('click',function(e){if(e.target===ov)close();});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(typeof THREE==="undefined"){ document.getElementById('fallback').style.display='grid'; return; } /* live */

  // ---------- palette (matched to Educational Village renders) ----------
  var C = {
    cream:0xeae1cc, creamWarm:0xe2d6ba, white:0xf0ead8,
    timber:0x6f4a2a, timberDark:0x4c3219, wood:0x8a5a34, woodLight:0xbb884d,
    terracotta:0xf04424, terracotta2:0xc92c1b, terracotta3:0xff6840,
    brick:0xd83425, brickDark:0x9f2119, slate:0x465568, slate2:0x2d3d50,
    stone:0xb4b1a2, stoneDark:0x898676,
    grass:0x51b62c, grassDark:0x278020, grassLight:0xa6e653, grassDeep:0x155d20,
    dirt:0xd99a50, dirtDark:0x9d5c27, sand:0xf1cf66, path:0xe2a753,
    water:0x279fe3, waterDeep:0x1266a0, foam:0xf7fdff,
    copper:0xb5724a, brass:0xc9a24a, iron:0x2c2c30, ironLight:0x6a6a72,
    leafGreen:0x39ad2c, leafYellow:0xf4c51f, leafOrange:0xf07c22, pine:0x145b2c, pine2:0x21863a,
    glow:0xffcf3d, trim:0xf2ac1f, cloth:0xfff0cf, red:0xee3026, blueCloth:0x79c9f2, crop:0x6fd128
  };

  // ---------- renderer / scene / camera ----------
  var canvas = document.getElementById('stage');
  var renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false}); }
  catch(e){ document.getElementById('fallback').style.display='grid'; return; }
  function pixelRatio(){ return Math.min(devicePixelRatio, innerWidth<600?1.4:1.75, Math.sqrt(3200000/(innerWidth*innerHeight))); }
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  (function(){
    var cv=document.createElement('canvas'); cv.width=8; cv.height=256;
    var g=cv.getContext('2d'); var grad=g.createLinearGradient(0,0,0,256);
    grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.55,'#ffffff');
    grad.addColorStop(0.82,'#f4f6f7'); grad.addColorStop(1,'#e9edef');
    g.fillStyle=grad; g.fillRect(0,0,8,256);
    var tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; scene.background=tex;
  })();
  scene.fog = new THREE.Fog(0xf7f8f8, 130, 230);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 400);
  var lookTarget = new THREE.Vector3(0,0,0);
  var HOME_POS = new THREE.Vector3(0, 8.4, 30), HOME_LOOK = new THREE.Vector3(0,0,0);
  camera.position.copy(HOME_POS); camera.lookAt(lookTarget);

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xc8e9ff, 0x2f7c32, 0.78));
  scene.add(new THREE.AmbientLight(0xffffff, 0.2));
  var sun = new THREE.DirectionalLight(0xffdda0, 1.5);
  sun.position.set(24, 30, 16); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  var sc = sun.shadow.camera; sc.near=1; sc.far=90; sc.left=-16; sc.right=16; sc.top=16; sc.bottom=-16;
  sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03; scene.add(sun);
  var fill = new THREE.DirectionalLight(0x74c6ff, 0.38); fill.position.set(-20,-6,-14); scene.add(fill);

  // ---------- globals ----------
  var R = 10;
  var YAXIS = new THREE.Vector3(0,1,0);
  var planet = new THREE.Group(); scene.add(planet);
  var planetMesh = null;
  var spinners = [], smokes = [];

  // river great circle (runs east-west through the front, tilted)
  var riverN = new THREE.Vector3(0,0.95,-0.31).normalize();
  var _u0 = new THREE.Vector3(0,1,0); if(Math.abs(_u0.dot(riverN))>0.95) _u0.set(1,0,0);
  var rU = new THREE.Vector3().crossVectors(_u0, riverN).normalize();
  var rV = new THREE.Vector3().crossVectors(riverN, rU).normalize();
  function riverDir(phi){ return rU.clone().multiplyScalar(Math.cos(phi)).add(rV.clone().multiplyScalar(Math.sin(phi))).normalize(); }
  function riverTangent(phi){ return rU.clone().multiplyScalar(-Math.sin(phi)).add(rV.clone().multiplyScalar(Math.cos(phi))).normalize(); }

  // ---------- material / primitive helpers ----------
  function mat(color, o){
    o=o||{};
    var m=new THREE.MeshStandardMaterial({ color:color,
      roughness:o.rough!==undefined?o.rough:0.82, metalness:o.metal!==undefined?o.metal:0.0,
      flatShading:o.flat!==undefined?o.flat:true });
    if(o.emissive){ m.emissive=new THREE.Color(o.emissive); m.emissiveIntensity=o.ei||1; }
    if(o.alpha!==undefined){ m.transparent=true; m.opacity=o.alpha; }
    return m;
  }
  function box(w,h,d,color,o){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
  function cyl(rt,rb,h,color,seg,o){ var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14),mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
  function cone(r,h,color,seg,o){ var m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||10),mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
  function sph(r,color,detail,o){ var m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,detail||1),mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
  function torus(r,t,color,o){ var m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,18),mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
  function gableRoof(w,d,rh,color){
    var hw=w/2, hd=d/2;
    var v=[-hw,0,-hd, -hw,0,hd, -hw,rh,0,  hw,0,-hd, hw,0,hd, hw,rh,0];
    function t(a,b,c,arr){ arr.push(v[a*3],v[a*3+1],v[a*3+2], v[b*3],v[b*3+1],v[b*3+2], v[c*3],v[c*3+1],v[c*3+2]); }
    var p=[]; t(0,2,5,p); t(0,5,3,p); t(1,4,5,p); t(1,5,2,p); t(0,3,4,p); t(0,4,1,p); t(0,1,2,p); t(3,5,4,p);
    var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); geo.computeVertexNormals();
    var m=new THREE.Mesh(geo,mat(color,{flat:true})); m.castShadow=true; m.receiveShadow=true; return m;
  }
  function plot(r){
    var ph=0.9, g=new THREE.Group();
    var side=mat(C.dirtDark,{}), top=mat(C.grass,{}), bot=mat(C.dirtDark,{});
    var cg=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.03,ph,24),[side,top,bot]);
    cg.castShadow=true; cg.receiveShadow=true; cg.position.y=-ph/2+0.02; g.add(cg); return g;
  }
  function addSmoke(group, pos){
    for(var i=0;i<3;i++){
      var p=sph(0.12+Math.random()*0.05, 0xeeeae2, 0, {rough:1,flat:false,alpha:0.5});
      p.castShadow=false; p.receiveShadow=false; p.position.copy(pos);
      p.userData={base:pos.clone(), t:Math.random(), sp:0.5+Math.random()*0.4};
      group.add(p); smokes.push(p);
    }
  }

  // ---------- environment props ----------
  function streetLamp(){
    var g=new THREE.Group();
    var base=cyl(0.09,0.12,0.2,C.iron,8,{rough:0.5,metal:0.3,flat:false}); base.position.y=0.1; g.add(base);
    var pole=cyl(0.05,0.06,1.4,C.iron,8,{rough:0.5,metal:0.3,flat:false}); pole.position.y=0.8; g.add(pole);
    var arm=box(0.04,0.04,0.3,C.iron,{rough:0.5,metal:0.3,flat:false}); arm.position.set(0,1.5,0.14); g.add(arm);
    var cage=box(0.18,0.22,0.18,C.iron,{rough:0.5,metal:0.3,flat:false}); cage.position.set(0,1.42,0.26); g.add(cage);
    var bulb=sph(0.07,C.glow,0,{emissive:C.glow,ei:1.6,flat:false}); bulb.castShadow=false; bulb.position.set(0,1.42,0.26); g.add(bulb);
    return g;
  }
  function fencePanel(len){
    var g=new THREE.Group();
    var posts=Math.max(2,Math.round(len/0.7));
    for(var i=0;i<=posts;i++){ var p=box(0.08,0.5,0.08,C.wood); p.position.set(-len/2+i*(len/posts),0.25,0); g.add(p); }
    var r1=box(len,0.06,0.05,C.woodLight); r1.position.y=0.18; g.add(r1);
    var r2=box(len,0.06,0.05,C.woodLight); r2.position.y=0.4; g.add(r2);
    return g;
  }
  function fenceRect(w,d){
    var g=new THREE.Group();
    var a=fencePanel(w); a.position.z=d/2; g.add(a);
    var b=fencePanel(w); b.position.z=-d/2; g.add(b);
    var c=fencePanel(d); c.rotation.y=Math.PI/2; c.position.x=w/2; g.add(c);
    var e=fencePanel(d); e.rotation.y=Math.PI/2; e.position.x=-w/2; g.add(e);
    return g;
  }
  function farmPlot(){
    var g=new THREE.Group();
    g.add(plot(1.5));
    var soil=box(2.2,0.14,1.8,C.dirtDark); soil.position.y=0.07; g.add(soil);
    for(var r=0;r<4;r++) for(var cc=0;cc<7;cc++){
      var sprout=cone(0.07,0.26,[C.crop,0x8cbf4e,C.leafYellow][(r+cc)%3],6); sprout.castShadow=false;
      sprout.position.set(-0.95+cc*0.32, 0.22, -0.65+r*0.43); g.add(sprout);
    }
    var f=fenceRect(2.5,2.1); g.add(f);
    // scarecrow

    var cWater=new THREE.Color(C.water), cWaterD=new THREE.Color(C.waterDeep), cSand=new THREE.Color(C.sand), cPath=new THREE.Color(C.path);
    var a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),v=new THREE.Vector3(), tmp=new THREE.Color();
    function noise(x,y,z){ return 0.55*Math.sin(x*1.7+y*2.3)*Math.cos(z*1.9-y*1.1)+0.30*Math.sin(x*4.1-z*3.3)*Math.cos(y*3.7+x*1.3)+0.15*Math.sin((x+y+z)*6.2); }

        if(clr>0.72) tmp.lerp(cPath,(clr-0.72)/0.28*0.7);
      }
      var fine=Math.sin((v.x*37.1+v.y*53.7+v.z*91.3)*8.4);
      var f=0.93+0.13*(fine*.5+.5);
      for(var k=0;k<3;k++){ colors[(i+k)*3]=tmp.r*f; colors[(i+k)*3+1]=tmp.g*f; colors[(i+k)*3+2]=tmp.b*f; }
    }
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3)); geo.computeVertexNormals();
    planetMesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,metalness:0,flatShading:false}));
    planetMesh.receiveShadow=true; planet.add(planetMesh);
    var core=new THREE.Mesh(new THREE.SphereGeometry(R*0.985,24,18),new THREE.MeshBasicMaterial({color:C.grassDeep})); planet.add(core);
  })();

  // ---------- atmosphere ----------
  (function(){
    var m=new THREE.ShaderMaterial({ uniforms:{gc:{value:new THREE.Color(0x9fd2ee)},cf:{value:0.3},pw:{value:4.4}},
      vertexShader:'varying float vi; uniform float cf; uniform float pw; void main(){ vec3 vn=normalize(normalMatrix*normal); vec3 vp=normalize((modelViewMatrix*vec4(position,1.0)).xyz); vi=pow(max(cf - dot(vn,-vp),0.0),pw); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'varying float vi; uniform vec3 gc; void main(){ gl_FragColor=vec4(gc,1.0)*clamp(vi,0.0,1.0); }',
      side:THREE.BackSide, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.12,48,32),m));
  })();

  // ---------- placement ----------
  function dirLatLon(lat,lon){ lat*=Math.PI/180; lon*=Math.PI/180; return new THREE.Vector3(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon)).normalize(); }
  var sites=[];
  function placeAligned(obj, dir, forwardWorld, scl){
    obj.position.copy(dir).multiplyScalar(R-0.14);
    obj.quaternion.setFromUnitVectors(YAXIS, dir);
    if(forwardWorld){
      var zc=new THREE.Vector3(0,0,1).applyQuaternion(obj.quaternion);
      var f=forwardWorld.clone().sub(dir.clone().multiplyScalar(forwardWorld.dot(dir)));
      if(f.lengthSq()>1e-6){ f.normalize(); var ang=Math.atan2(new THREE.Vector3().crossVectors(zc,f).dot(dir), zc.dot(f)); obj.rotateY(ang); }
    }
    if(scl) obj.scale.setScalar(scl);
    planet.add(obj); sites.push(dir.clone());
  }
  // village anchor on the river
  var anchor=dirLatLon(18,90);
  var phi0=Math.atan2(anchor.dot(rV), anchor.dot(rU));
  function bankDir(phi, bank){
    var d=riverDir(phi), t=riverTangent(phi), cross=new THREE.Vector3().crossVectors(d,t).normalize();
    return d.clone().multiplyScalar(Math.cos(bank)).add(cross.clone().multiplyScalar(Math.sin(bank))).normalize();
  }
  function riverward(phi, bank){ // world dir pointing toward the river (for door facing)
    var d=riverDir(phi), t=riverTangent(phi), cross=new THREE.Vector3().crossVectors(d,t).normalize();
    return cross.multiplyScalar(-Math.sign(bank||1));
  }
  // the three hero buildings + cottages clustered along the river banks
  var village=[
    {f:waterHouse,  dp:-0.42, bank: 0.12, s:1.0},
    {f:rationShop,  dp:-0.18, bank:-0.12, s:1.0},
    {f:electricHouse,dp:0.24, bank:-0.12, s:1.0},
    {f:function(){return cottage({roof:C.terracotta3});}, dp:0.02, bank:0.13, s:0.95},
    {f:function(){return cottage({wall:C.creamWarm,roof:C.terracotta2});}, dp:0.5, bank:0.13, s:0.9},
    {f:function(){return cottage({wall:C.brick,roof:C.slate});}, dp:0.46, bank:-0.13, s:0.9},
    {f:windmill, dp:-0.66, bank:-0.16, s:1.0}
  ];
  village.forEach(function(it){ var phi=phi0+it.dp; placeAligned(it.f(), bankDir(phi,it.bank), riverward(phi,it.bank), it.s); });
  // bridges across the river
  [phi0-0.3, phi0+0.14].forEach(function(phi){ var d=riverDir(phi), t=riverTangent(phi), cross=new THREE.Vector3().crossVectors(d,t); placeAligned(bridge(), d, cross, 1.0); });
  // street lamps along the banks
  [-0.5,-0.26,0.0,0.3].forEach(function(dp){ var phi=phi0+dp; placeAligned(streetLamp(), bankDir(phi,0.19), riverward(phi,0.19), 0.95); });
  // farm plots a bit away from the river
  placeAligned(farmPlot(), bankDir(phi0+0.35,0.34), null, 1.0);
  placeAligned(farmPlot(), bankDir(phi0-0.42,0.36), null, 0.95);
  // outlying cottages elsewhere on the globe
  placeAligned(cottage(), dirLatLon(-30,150), null, 0.85);
  placeAligned(cottage({roof:C.terracotta2}), dirLatLon(-14,-40), null, 0.85);
  placeAligned(windmill(), dirLatLon(-44,210), null, 0.9);
  placeAligned(waterHouse(), dirLatLon(30,320), null, 0.8);

  // scatter trees/pines/rocks, denser near the village, skipping sites
  (function scatter(){
    var N=230, golden=Math.PI*(3-Math.sqrt(5));
    for(var i=0;i<N;i++){
      var y=1-(i/(N-1))*2, rr=Math.sqrt(1-y*y), th=golden*i;
      var dir=new THREE.Vector3(Math.cos(th)*rr,y,Math.sin(th)*rr);
      if(Math.abs(dir.dot(riverN))<0.05) continue;   // keep the river clear
      var near=false; for(var s=0;s<sites.length;s++){ if(dir.dot(sites[s])>0.985){ near=true; break; } }
      if(near) continue;
      var kind=Math.random();
      var o = kind<0.1 ? rock() : tree(Math.random()<0.38?'pine':'leaf');
      var sc=0.8+Math.random()*0.6; o.scale.setScalar(sc);
      o.position.copy(dir).multiplyScalar(R-0.1);
      o.quaternion.setFromUnitVectors(YAXIS,dir); o.rotateY(Math.random()*Math.PI*2);
      planet.add(o);
    }
  })();

  // ---------- moving clouds + circling birds ----------
  var clouds=new THREE.Group(),cloudItems=[]; scene.add(clouds);
  (function(){
    var cloudGeo=new THREE.IcosahedronGeometry(1,1);
    var cloudMats=[mat(0xffffff,{rough:.96,flat:false}),mat(0xd9dee2,{rough:.98,flat:false})];
    for(var i=0;i<8;i++){
      var cl=new THREE.Group();
      [[0,0,0,.72],[.72,-.05,.1,.5],[-.66,-.02,-.08,.56],[.22,.25,-.2,.44],[-.15,.15,.24,.38]].forEach(function(p,j){
        var m=new THREE.Mesh(cloudGeo,cloudMats[(i+j)%cloudMats.length]); m.castShadow=false; m.receiveShadow=false; m.position.set(p[0],p[1],p[2]); m.scale.set(p[3]*1.12,p[3]*.74,p[3]); cl.add(m);
      });
      cl.scale.setScalar(1.05+Math.random()*.85);
      var dir=dirLatLon(-22+Math.random()*74,Math.random()*360);
      cl.position.copy(dir).multiplyScalar(R*(1.42+Math.random()*.22)); cl.quaternion.setFromUnitVectors(YAXIS,dir); clouds.add(cl);
      cloudItems.push({o:cl,base:cl.position.clone(),phase:Math.random()*Math.PI*2,speed:.35+Math.random()*.35});
    }
  })();

  var birdItems=[];
  (function(){
    var flock=new THREE.Group(); scene.add(flock);
    var wingGeo=new THREE.BufferGeometry();
    wingGeo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,.82,.06,.08,.24,.03,-.34],3)); wingGeo.computeVertexNormals();
    var wingMat=new THREE.MeshBasicMaterial({color:0x26333d,side:THREE.DoubleSide});
    var bodyGeo=new THREE.SphereGeometry(.13,8,6),bodyMat=new THREE.MeshBasicMaterial({color:0x202b33});
    for(var i=0;i<7;i++){
      var pivot=new THREE.Group(),bird=new THREE.Group(),body=new THREE.Mesh(bodyGeo,bodyMat);
      body.scale.set(.8,.55,1.7); bird.add(body);
      var left=new THREE.Mesh(wingGeo,wingMat),right=new THREE.Mesh(wingGeo,wingMat); right.scale.x=-1; bird.add(left,right);
      var radius=R*(1.35+Math.random()*.32),baseY=-1+Math.random()*8;
      bird.position.set(radius,baseY,0); bird.rotation.y=Math.PI/2; pivot.rotation.y=Math.random()*Math.PI*2; pivot.rotation.z=(Math.random()-.5)*.22; pivot.add(bird); flock.add(pivot);
      birdItems.push({pivot:pivot,bird:bird,left:left,right:right,baseY:baseY,phase:Math.random()*Math.PI*2,speed:.18+Math.random()*.12});
    }
  })();

  // ---------- interaction: drag to spin, click to zoom ----------
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var autoSpeed=reduce?0:0.08;
  var yaw=0.0, pitch=-0.12, dragYaw=0, dragPitch=0, vYaw=0, vPitch=0;
  var dragging=false, lastX=0, lastY=0, downX=0, downY=0, moved=0;
  var state='orbit'; // orbit | spinning | zooming | waiting | village | leaving
  var spinElapsed=0,pendingZoom=null;
  var camTween=null;
  var raycaster=new THREE.Raycaster();
  var hintEl=document.getElementById('hint'), titleEl=document.getElementById('titleScreen'), startBtn=document.getElementById('startBtn');
  var statusEl=document.getElementById('loadStatus');
  var frame=null, ready=false, loadTimeout;

  function openVillage(){
    if(!ready || state!=='waiting' || document.hidden) return;
    state='village';
    clearTimeout(loadTimeout);
    titleEl.classList.add('out');
    titleEl.inert=true;
    document.body.classList.add('journey-open');
    frame.removeAttribute('inert');
    frame.removeAttribute('aria-hidden');
    frame.removeAttribute('tabindex');
    frame.classList.add('open');
    frame.contentWindow.postMessage({type:'rebuild:show'},location.origin);
    setTimeout(function(){
      var geometries=new Set(), materials=new Set();
      scene.traverse(function(o){
        if(o.geometry) geometries.add(o.geometry);
        if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){materials.add(m);});
      });
      geometries.forEach(function(g){g.dispose();});
      var textures=new Set();
      materials.forEach(function(m){
        Object.values(m).forEach(function(v){if(v&&v.isTexture) textures.add(v);});
        m.dispose();
      });
      if(scene.background && scene.background.isTexture) textures.add(scene.background);
      textures.forEach(function(t){t.dispose();});
      if(sun.shadow.map) sun.shadow.map.dispose();
      renderer.dispose();
      canvas.remove();
    },reduce?130:580);
  }
  window.addEventListener('message', function(e){
    if(!frame || e.source!==frame.contentWindow || e.origin!==location.origin) return;
    if(e.data?.type==='rebuild:ready'){
      ready=true;
      if(state==='village') frame.contentWindow.postMessage({type:'rebuild:show'},location.origin);
      else openVillage();
    }
    if(e.data?.type==='rebuild:load-error' && state!=='village') zoomOut('The village could not load. Tap Start to try again.');
    if(e.data?.type==='rebuild:module' && e.data.chapter==='water' && state==='village'){
      state='handoff';
      location.assign('modules/water-purification.html?journey=water');
    }
  });

  function startTween(p1,l1,dur,after){
    camTween={t:0,dur:dur,p0:camera.position.clone(),p1:p1.clone(),l0:lookTarget.clone(),l1:l1.clone(),after:after};
  }
  function easeInOut(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }

  function zoomTo(hitWorld){
    state='zooming';
    var nrm=hitWorld.clone().normalize();
    var east=new THREE.Vector3().crossVectors(YAXIS,nrm); if(east.lengthSq()<1e-4) east.set(1,0,0); east.normalize();
    var up=new THREE.Vector3().crossVectors(nrm,east).normalize();
    var camPos=nrm.clone().multiplyScalar(R+6.2).add(up.clone().multiplyScalar(2.2));
    startTween(reduce?HOME_POS:camPos, reduce?HOME_LOOK:hitWorld, reduce?.16:1.55, function(){
      state='waiting';
      window.dispatchEvent(new CustomEvent('villageplanet:enter',{detail:{x:nrm.x,y:nrm.y,z:nrm.z}}));
      openVillage();
    });
    canvas.classList.add('zoom');
    hintEl.style.opacity='0';
  }
  function beginJourney(x,y){
    if(state!=='orbit') return;
    state='spinning'; spinElapsed=0; pendingZoom={x:x,y:y};
    ready=false;
    frame=document.createElement('iframe');
    frame.id='villageFrame';
    frame.title='REBUILD village';
    frame.setAttribute('inert','');
    frame.setAttribute('aria-hidden','true');
    frame.tabIndex=-1;
    frame.src='preview/?embed=1';
    document.body.appendChild(frame);
    statusEl.textContent='Loading the village…';
    loadTimeout=setTimeout(function(){ zoomOut('The village took too long to load. Tap Start to try again.'); },40000);
    if(startBtn){ startBtn.disabled=true; startBtn.classList.add('starting'); }
    if(hintEl) hintEl.style.opacity='.58';
  }
  function zoomOut(message){
    if(!frame || state==='village' || state==='handoff') return;
    clearTimeout(loadTimeout);
    frame.remove(); frame=null; ready=false; pendingZoom=null;
    state='leaving';
    startTween(HOME_POS, HOME_LOOK, reduce?.05:.48, function(){
      state='orbit';
      canvas.classList.remove('zoom');
      startBtn.disabled=false;
      startBtn.classList.remove('starting');
    });
    statusEl.textContent=message || '';
    hintEl.style.opacity='';
  }
  if(startBtn) startBtn.addEventListener('click', function(e){ e.stopPropagation(); beginJourney(window.innerWidth/2, window.innerHeight/2); });
  window.addEventListener('keydown', function(e){ if(e.key==='Escape') zoomOut(); });
  window.VillagePlanet={ zoomOut:zoomOut, isZoomed:function(){return state==='village' || state==='handoff';} };
  window.addEventListener('pageshow', function(e){
    if(e.persisted && (state==='village'||state==='handoff')) location.reload();
  });

  function tryClickZoom(x,y){
    if((state!=='orbit'&&state!=='spinning') || !planetMesh) return;
    var ndc=new THREE.Vector2((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1);
    raycaster.setFromCamera(ndc,camera);
    var hit=raycaster.intersectObject(planetMesh,false);
    var target=hit&&hit.length?hit[0].point.clone():null;
    if(!target){
      target=new THREE.Vector3();
      if(!raycaster.ray.intersectSphere(new THREE.Sphere(new THREE.Vector3(),R),target)) target.copy(camera.position).normalize().multiplyScalar(R);
    }
    zoomTo(target);
  }

  canvas.addEventListener('pointerdown', function(e){
    if(!e.isPrimary || state!=='orbit') return;
    downX=lastX=e.clientX; downY=lastY=e.clientY; moved=0;
    dragging=true; vYaw=0; vPitch=0; canvas.classList.add('drag');
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    moved+=Math.abs(e.clientX-lastX)+Math.abs(e.clientY-lastY);
    if(dragging && state==='orbit'){
      var dx=(e.clientX-lastX)/window.innerWidth, dy=(e.clientY-lastY)/window.innerHeight;
      dragYaw+=dx*3.2; dragPitch=Math.max(-0.9,Math.min(0.9,dragPitch+dy*2.2));
      vYaw=dx*3.2; vPitch=dy*2.2;
    }
    lastX=e.clientX; lastY=e.clientY;
  });
  function pointerUp(e){
    if(!e.isPrimary || !dragging) return;
    dragging=false; canvas.classList.remove('drag');
    if(moved<7 && state==='orbit'){ beginJourney(downX,downY); }
  }
  canvas.addEventListener('pointerup', pointerUp); canvas.addEventListener('pointercancel', function(){ dragging=false; canvas.classList.remove('drag'); });

  // ---------- animate ----------
  var lastFrame=performance.now(), elapsed=0;
  document.addEventListener('visibilitychange', function(){ lastFrame=performance.now(); openVillage(); });
  function tick(){
    if(state==='village'||state==='handoff') return;
    var now=performance.now(), gap=(now-lastFrame)/1000;
    lastFrame=now;
    var dt=document.hidden||gap>.25?0:Math.min(gap,.05);
    elapsed+=dt;
    if(state==='orbit'||state==='spinning'){
      if(!dragging&&!reduce){ var inertia=Math.pow(.94,dt*60); dragYaw+=vYaw*(1-inertia)/.06; dragPitch=Math.max(-.9,Math.min(.9,dragPitch+vPitch*(1-inertia)/.06)); vYaw*=inertia; vPitch*=inertia; dragPitch*=Math.pow(.988,dt*60); }
      yaw+=(state==='spinning'&&!reduce?.58:autoSpeed)*dt;
      planet.rotation.y=yaw+dragYaw; planet.rotation.x=pitch+dragPitch;
      if(state==='spinning'){
        spinElapsed+=dt;
        if(spinElapsed>=(reduce?.15:1.05)&&pendingZoom){ var pz=pendingZoom; pendingZoom=null; tryClickZoom(pz.x,pz.y); }
      }
    }
    if(!reduce){
      clouds.rotation.y+=dt*.034; clouds.rotation.x=planet.rotation.x*.34;
      for(var ci=0;ci<cloudItems.length;ci++){ var cd=cloudItems[ci],pulse=1+Math.sin(elapsed*cd.speed+cd.phase)*.012; cd.o.position.copy(cd.base).multiplyScalar(pulse); cd.o.rotation.y+=dt*.019; }
      for(var bi=0;bi<birdItems.length;bi++){ var bd=birdItems[bi],flap=Math.sin(elapsed*8.5+bd.phase); bd.pivot.rotation.y+=dt*bd.speed; bd.bird.position.y=bd.baseY+Math.sin(elapsed*1.8+bd.phase)*.26; bd.left.rotation.z=.18+flap*.48; bd.right.rotation.z=-.18-flap*.48; bd.bird.rotation.z=Math.sin(elapsed*1.1+bd.phase)*.08; }
    }
    if(camTween){
      camTween.t+=dt; var k=Math.min(1,camTween.t/camTween.dur), e=easeInOut(k);
      camera.position.lerpVectors(camTween.p0,camTween.p1,e);
      lookTarget.lerpVectors(camTween.l0,camTween.l1,e);
      if(k>=1){ var af=camTween.after; camTween=null; if(af) af(); }
    }
    camera.lookAt(lookTarget);
    if(!reduce){
      for(var i=0;i<spinners.length;i++){ var s=spinners[i]; s.obj.rotation[s.axis]+=dt*s.speed; }
      for(var m=0;m<smokes.length;m++){ var p=smokes[m], u=p.userData; u.t+=dt*u.sp; var fr=u.t%1; p.position.set(u.base.x+Math.sin(u.t*2)*0.06,u.base.y+fr*0.9,u.base.z); p.scale.setScalar(0.5+fr*1.1); p.material.opacity=Math.max(0,0.5*(1-fr)); }
    }
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', function(){
    if(state==='village'||state==='handoff') return;
    camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
  setTimeout(function(){ if(hintEl && state==='orbit') hintEl.style.opacity='0.55'; }, 9000);
})();
</script>
</body></html>
