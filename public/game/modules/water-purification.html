<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Rebuild – Clean Water Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Noto+Sans+Kannada:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/rebuild-shell.css">
<style>body,.dialogue,.txt,.rnb,.rebuild-voice-toggle{font-family:"Nunito","Noto Sans Kannada",system-ui,sans-serif}</style>
<script src="../shared/rebuild-notebook.js"></script>
<script defer src="../shared/rebuild-shell.js"></script>
<!-- REBUILD unified: telemetry bridge + bilingual voice + dashboard hooks -->
<script src="../shared/rebuild-telemetry.js"></script>
<script src="../shared/rebuild-voice.js"></script>
<script src="../shared/rebuild-hooks.js"></script>
<script>RebuildVoice.init({ audioBase: "../audio", module: "water", dialoguesUrl: "../shared/dialogues.json" });</script>
<style>
:root{
  --ink:#2b2118;--cream:#fff8ea;--cream2:#f6e6c4;--cream3:#eed7ab;
  --wood:#7a4e2d;--wood2:#5a3720;--wood3:#915f39;
  --green:#4fa52f;--green2:#2f6e1c;
  --blue:#2a7fc0;--blue2:#185a8c;
  --aqua:#3bc8ec;--aqua2:#189cd2;
  --red:#c8502f;--gold:#f2c14e;--gold2:#ffe29a;
  --u:1;
  --rim:rgba(255,255,255,.8);
  --goldrim:rgba(255,220,140,.6);
  --shadow1:0 calc(10px*var(--u)) calc(26px*var(--u)) rgba(20,12,4,.38);
  --shadow2:0 calc(18px*var(--u)) calc(44px*var(--u)) rgba(12,8,2,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(130% 120% at 50% -10%,#273243 0%,#1b222e 46%,#141922 100%);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:calc(18px*var(--u))}
#ui button{pointer-events:auto;font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== ambient environment overlay (over 3D scene, under UI, never interactive) ===== */
#amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.amb-grade{position:absolute;inset:0;background:
  radial-gradient(120% 85% at 50% 8%,rgba(120,200,255,.14),rgba(120,200,255,0) 55%),
  linear-gradient(180deg,rgba(255,240,205,.07),rgba(10,20,30,0) 30%,rgba(10,20,30,.1) 100%);
  mix-blend-mode:screen;opacity:.9}
.amb-vignette{position:absolute;inset:0;background:radial-gradient(130% 110% at 50% 42%,rgba(0,0,0,0) 52%,rgba(8,10,14,.28) 82%,rgba(6,8,12,.5) 100%)}
.amb-rays{position:absolute;left:-10%;right:-10%;top:-30%;height:150%;
  background:repeating-linear-gradient(72deg,rgba(255,244,210,.05) 0 calc(28px*var(--u)),rgba(255,244,210,0) calc(28px*var(--u)) calc(90px*var(--u)));
  mix-blend-mode:screen;opacity:.0;transform-origin:top center;animation:rays 11s ease-in-out infinite;filter:blur(2px)}
@keyframes rays{0%,100%{opacity:.08;transform:translateX(-2%) scaleX(1)}50%{opacity:.22;transform:translateX(2%) scaleX(1.04)}}
.amb-motes{position:absolute;inset:0}
.amb-motes i{position:absolute;bottom:-6%;width:calc(7px*var(--u));height:calc(7px*var(--u));border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(180,225,255,.5) 45%,rgba(140,200,255,0) 72%);
  box-shadow:0 0 calc(10px*var(--u)) rgba(170,220,255,.5);opacity:0;animation:mote linear infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0) translateX(0) scale(.7)}10%{opacity:.75}90%{opacity:.5}100%{opacity:0;transform:translateY(-112vh) translateX(var(--mx,12px)) scale(1.1)}}
.amb-motes i:nth-child(1){left:8%;--mx:18px;width:calc(5px*var(--u));height:calc(5px*var(--u));animation-duration:17s;animation-delay:-2s}
.amb-motes i:nth-child(2){left:20%;--mx:-22px;animation-duration:22s;animation-delay:-9s}
.amb-motes i:nth-child(3){left:33%;--mx:14px;width:calc(9px*var(--u));height:calc(9px*var(--u));animation-duration:19s;animation-delay:-4s}
.amb-motes i:nth-child(4){left:46%;--mx:-16px;animation-duration:24s;animation-delay:-14s}
.amb-motes i:nth-child(5){left:58%;--mx:20px;width:calc(5px*var(--u));height:calc(5px*var(--u));animation-duration:20s;animation-delay:-7s}
.amb-motes i:nth-child(6){left:69%;--mx:-18px;animation-duration:26s;animation-delay:-18s}
.amb-motes i:nth-child(7){left:80%;--mx:16px;width:calc(8px*var(--u));height:calc(8px*var(--u));animation-duration:18s;animation-delay:-11s}
.amb-motes i:nth-child(8){left:91%;--mx:-12px;animation-duration:23s;animation-delay:-3s}
.amb-topglow{position:absolute;left:0;right:0;top:0;height:40%;background:radial-gradient(90% 100% at 50% 0,rgba(255,240,200,.16),rgba(255,240,200,0) 70%);mix-blend-mode:screen;opacity:.8}
@media (prefers-reduced-motion:reduce){.amb-rays,.amb-motes i{animation:none}}

.panel{position:relative;background:
  linear-gradient(180deg,var(--cream) 0%,var(--cream2) 78%,var(--cream3) 100%);
  border:calc(4px*var(--u)) solid var(--wood);border-radius:calc(22px*var(--u));
  box-shadow:inset 0 calc(-6px*var(--u)) 0 rgba(122,78,45,.2),inset 0 2px 0 var(--rim),inset 0 0 0 calc(2px*var(--u)) var(--goldrim),var(--shadow1)}
.panel::before{content:"";position:absolute;inset:calc(3px*var(--u));border-radius:calc(17px*var(--u));pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0,rgba(255,255,255,.5),rgba(255,255,255,0) 42%);opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:none;cursor:pointer;font-family:Fredoka,Nunito,sans-serif!important;font-weight:600;font-size:1.15em;color:#fff;padding:.62em 1.3em;border-radius:999px;background:linear-gradient(180deg,#7bd451,#55ad32 52%,var(--green2));border-bottom:calc(6px*var(--u)) solid var(--green2);text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 calc(8px*var(--u)) calc(18px*var(--u)) rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.45),inset 0 calc(-3px*var(--u)) calc(6px*var(--u)) rgba(0,0,0,.18);transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .2s,box-shadow .2s;position:relative;overflow:hidden;min-height:44px;will-change:transform}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:5%;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none;opacity:.55}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));opacity:0;pointer-events:none}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:hover::after{animation:sheen .7s ease}
@keyframes sheen{0%{left:-60%;opacity:0}20%{opacity:1}100%{left:120%;opacity:0}}
.btn:active,.btn.down{transform:translateY(3px);border-bottom-width:calc(3px*var(--u));filter:brightness(.98)}
.btn:disabled{filter:grayscale(.8) brightness(.85);cursor:default}
.btn.blue{background:linear-gradient(180deg,#5cb0ea,#2f87c6 52%,var(--blue2));border-bottom-color:var(--blue2)}
.btn.orange{background:linear-gradient(180deg,#f79a57,#df6a2d 52%,#9a3f17);border-bottom-color:#9a3f17}
.btn.brown{background:linear-gradient(180deg,#b3815461,#8a5a32 10%,var(--wood) 55%,var(--wood2));border-bottom-color:var(--wood2)}
.btn.gold{background:linear-gradient(180deg,#ffe596,#f4bc43 52%,#d99a1e);border-bottom-color:#b07a14;color:#3a2610;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gold::before{opacity:.5}
.btn.ghost{background:linear-gradient(180deg,#fffaf0,rgba(255,248,234,.9));color:var(--wood2);border-bottom-color:#c9ae84;text-shadow:none}
.btn.ghost::before{opacity:.4}
.btn.big{font-size:1.75em;padding:.55em 1.6em;letter-spacing:.01em}
.btn.small{font-size:.95em;padding:.45em 1em}
.btn .fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.3));pointer-events:none}
.ibtn{position:relative;width:calc(54px*var(--u));height:calc(54px*var(--u));min-width:44px;min-height:44px;border-radius:calc(17px*var(--u));border:calc(4px*var(--u)) solid var(--wood);background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 2px 0 var(--rim),inset 0 0 0 2px var(--goldrim);font-size:1.25em;touch-action:manipulation;transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .18s}
.ibtn:hover{filter:brightness(1.05)}
.ibtn:active{transform:translateY(2px)}

/* title */
.screen{position:absolute;inset:0;pointer-events:auto;transition:opacity .6s}
.screen.out{opacity:0;pointer-events:none}
.title{display:flex;align-items:center;justify-content:center;background:
  radial-gradient(ellipse at 50% 32%,rgba(30,58,86,.35) 0%,rgba(16,22,34,.72) 55%,rgba(10,14,22,.9) 100%)}
.title::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 50% at 50% 24%,rgba(120,200,255,.18),rgba(120,200,255,0) 70%),
  radial-gradient(80% 60% at 50% 120%,rgba(79,165,47,.2),rgba(79,165,47,0) 70%);
  mix-blend-mode:screen;animation:titleglow 7s ease-in-out infinite;pointer-events:none}
@keyframes titleglow{0%,100%{opacity:.7}50%{opacity:1}}
.title::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(10,14,22,0),rgba(10,14,22,.55));pointer-events:none}
.title-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(14px*var(--u));text-align:center;padding:20px;z-index:1}
.logo{display:flex;gap:.02em;font-family:Fredoka,sans-serif;font-weight:700;font-size:calc(128px*var(--u));line-height:1;letter-spacing:.02em}
.logo span{display:inline-block;color:#ffd65c;background:linear-gradient(180deg,#fff6d6,#ffde74 50%,#f7b23e 82%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:calc(5px*var(--u)) #6b2a12;paint-order:stroke fill;text-shadow:0 calc(8px*var(--u)) 0 #6b2a12,0 calc(16px*var(--u)) calc(30px*var(--u)) rgba(0,0,0,.55),0 0 calc(36px*var(--u)) rgba(255,205,95,.5);animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 2px 1px rgba(255,230,150,.5))}
.logo span:nth-child(2n){background:linear-gradient(180deg,#ffead4,#ffbe5a 50%,#ef962a 82%);-webkit-background-clip:text;background-clip:text}
.logo span:nth-child(1){animation-delay:0s}.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}.logo span:nth-child(5){animation-delay:.48s}.logo span:nth-child(6){animation-delay:.6s}.logo span:nth-child(7){animation-delay:.72s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(calc(-8px*var(--u))) rotate(1.5deg)}}
.tagline{margin:0;color:#fff;font-weight:900;font-size:1.35em;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.65),0 0 24px rgba(120,190,255,.25)}
.loadbar{position:relative;width:calc(440px*var(--u));height:calc(20px*var(--u));border-radius:99px;background:rgba(0,0,0,.4);border:calc(3px*var(--u)) solid var(--cream);overflow:hidden;margin-top:calc(16px*var(--u));box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.4)}
.loadbar i{position:relative;display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#ffb347 60%,#ff9b3d);transition:width .3s;box-shadow:0 0 14px rgba(255,190,90,.7)}
.loadbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));animation:loadshine 1.3s linear infinite}
@keyframes loadshine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.loadtxt{margin:0;color:#fff;font-weight:800;font-size:.9em;letter-spacing:.03em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.title .start{opacity:0;transform:scale(.9);transition:all .4s}
.title.ready .start{opacity:1;transform:scale(1);animation:pulse 1.6s ease-in-out infinite}
.title.ready .loadbar,.title.ready .loadtxt{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,92,.6),0 10px 24px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 calc(16px*var(--u)) rgba(255,214,92,0),0 10px 24px rgba(0,0,0,.3)}}
.hint{margin:0;display:flex;align-items:center;gap:.4em;color:#fff;font-weight:800;font-size:.85em;opacity:.92;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chips{position:absolute;top:calc(18px*var(--u));left:calc(18px*var(--u));display:flex;gap:8px;z-index:2}
.chips span{background:linear-gradient(180deg,rgba(255,252,244,.96),rgba(246,230,196,.94));color:var(--ink);font-weight:900;font-size:.75em;padding:.45em .9em;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 #fff;border:1px solid rgba(122,78,45,.25)}
.video{background:#000;display:flex;align-items:center;justify-content:center}
.video video{width:100%;height:100%;object-fit:contain}
.video .skip{position:absolute;right:calc(20px*var(--u));bottom:calc(20px*var(--u))}

/* hud */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(14px*var(--u)) calc(16px*var(--u));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;opacity:0;transform:translateY(-20px);transition:all .5s}
.hud.on{opacity:1;transform:none}
.hud .right{display:flex;gap:calc(10px*var(--u))}
.hud .progress{display:flex;align-items:center;gap:.6em;padding:.5em 1em;font-family:Fredoka,sans-serif;font-size:1em;pointer-events:none;transition:opacity .3s;background:linear-gradient(180deg,rgba(255,252,244,.95),rgba(246,230,196,.92));border-radius:99px;border:calc(3px*var(--u)) solid var(--wood);box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 2px 0 #fff}
.hud .progress.off{display:none}
.hud .progress b{font-weight:600;color:var(--wood2)}
.segs{display:flex;gap:4px}
.segs i{width:calc(28px*var(--u));height:calc(12px*var(--u));border-radius:6px;background:#dccdb0;box-shadow:inset 0 2px 0 rgba(0,0,0,.14)}
.segs i.on{background:linear-gradient(180deg,#8fe0ff,var(--aqua2));box-shadow:0 0 10px rgba(80,200,255,.9),inset 0 1px 0 rgba(255,255,255,.6)}
.hud .steps{display:none;gap:.35em;padding:.4em .6em;flex-wrap:wrap;justify-content:center;background:linear-gradient(180deg,rgba(255,252,244,.92),rgba(246,230,196,.9));border-radius:99px;border:calc(3px*var(--u)) solid var(--wood);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.hud .steps.on{display:flex}
.steps span{display:inline-flex;align-items:center;gap:.3em;font-weight:900;font-size:.8em;padding:.34em .78em;border-radius:99px;background:#e9dcc3;color:#7a6650;transition:all .3s}
.steps span em{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;background:#cdbb9b;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
.steps span.done{background:linear-gradient(180deg,#e2f3d3,#cfe9bc);color:#2f5a1c;box-shadow:inset 0 0 0 1px rgba(79,165,47,.4)}
.steps span.done em{background:linear-gradient(180deg,#6cc544,var(--green2))}
.steps span.cur{background:linear-gradient(180deg,#55b0ec,var(--blue));color:#fff;box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(42,127,192,.5)}
.steps span.cur em{background:rgba(255,255,255,.3)}

/* markers */
.markers{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.markers.on{opacity:1}
.markers.on .marker{pointer-events:auto}
.marker{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;cursor:pointer;transform:translate(-50%,-100%);pointer-events:none;will-change:transform}
.marker .disc{position:relative;width:calc(64px*var(--u));height:calc(64px*var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6em;border:calc(4px*var(--u)) solid #fff;background:radial-gradient(circle at 38% 30%,#9c9083,#726658);box-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.4)}
.marker .badge{position:absolute;right:-8px;bottom:-6px;width:calc(28px*var(--u));height:calc(28px*var(--u));border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:.55em;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.marker .lbl{background:rgba(43,33,24,.85);color:#fff7e8;font-weight:900;font-size:.72em;padding:.32em .82em;border-radius:99px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
.marker.open .disc{background:radial-gradient(circle at 38% 30%,#86d7ff,var(--blue));width:calc(80px*var(--u));height:calc(80px*var(--u));font-size:2em;animation:mpulse 1.5s ease-in-out infinite}
.marker.open .badge{display:none}
.marker.open .lbl{background:linear-gradient(180deg,#3f97d8,var(--blue2));font-size:.85em;border:2px solid #fff}
.marker.done .disc{background:radial-gradient(circle at 38% 30%,#8ad66a,var(--green))}
.marker.done .badge{background:var(--green2)}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(140,215,255,.85),0 8px 18px rgba(0,0,0,.4);transform:translateY(0)}50%{box-shadow:0 0 0 calc(18px*var(--u)) rgba(140,215,255,0),0 8px 18px rgba(0,0,0,.4);transform:translateY(-6px)}}

/* dialogue */
.dialogue{position:absolute;left:50%;bottom:calc(16px*var(--u));width:min(calc(880px*var(--u)),calc(100% - 24px));transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:flex-end;pointer-events:none}
.dialogue.on{transform:translate(-50%,0);pointer-events:auto}
.dialogue .portrait{position:relative;width:calc(118px*var(--u));height:calc(118px*var(--u));border-radius:50%;border:calc(5px*var(--u)) solid var(--wood);background:radial-gradient(circle at 40% 32%,var(--gold2),var(--gold));overflow:hidden;flex-shrink:0;margin-right:calc(-26px*var(--u));z-index:1;box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 0 0 calc(2px*var(--u)) rgba(255,255,255,.5),0 0 0 calc(3px*var(--u)) var(--goldrim)}
.dialogue .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.dialogue .box{flex:1;padding:calc(16px*var(--u)) calc(22px*var(--u)) calc(16px*var(--u)) calc(44px*var(--u));position:relative;min-height:calc(96px*var(--u))}
.dialogue .name{position:absolute;top:calc(-16px*var(--u));left:calc(40px*var(--u));background:linear-gradient(180deg,#e8744a,var(--red));color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:.9em;padding:.22em .95em;border-radius:10px;border:calc(3px*var(--u)) solid var(--wood);box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.dialogue .txt{margin:.3em 0 0;font-weight:800;font-size:1.12em;line-height:1.38;color:#3a2c1e}
.dialogue .more{position:absolute;right:calc(18px*var(--u));bottom:calc(8px*var(--u));font-weight:900;font-size:.75em;color:#8a6a4a;opacity:0}
.dialogue.wait .more{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* actions */
.actions{position:absolute;right:calc(18px*var(--u));bottom:calc(150px*var(--u));display:flex;flex-direction:column;align-items:flex-end;gap:calc(12px*var(--u));z-index:5;pointer-events:auto}
.actions .btn{font-size:1.05em}
.actions .hold{min-width:calc(190px*var(--u))}

/* toasts */
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(84px*var(--u));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.toast{display:flex;gap:.7em;align-items:center;padding:.65em 1.05em;max-width:calc(380px*var(--u));background:linear-gradient(180deg,rgba(255,252,244,.98),rgba(246,230,196,.96));border:calc(3px*var(--u)) solid var(--wood);border-radius:calc(16px*var(--u));box-shadow:0 12px 26px rgba(0,0,0,.3),inset 0 2px 0 #fff;animation:tin .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{transition:all .5s;opacity:0;transform:translateY(-20px)}
.toast .ticon{width:2.2em;height:2.2em;border-radius:12px;background:linear-gradient(180deg,#6cc544,var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1em;flex-shrink:0;box-shadow:0 4px 10px rgba(47,110,28,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.toast small{display:block;font-weight:900;font-size:.65em;letter-spacing:.07em;color:var(--green2);text-transform:uppercase}
.toast b{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.05em;color:var(--ink)}
.toast p{margin:.1em 0 0;font-size:.78em;font-weight:700;color:#5c4a3a}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}}

/* modal */
.modal{position:absolute;inset:0;background:radial-gradient(130% 110% at 50% 40%,rgba(20,14,8,.35),rgba(14,9,4,.62));display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fin .25s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.out{opacity:0;transition:opacity .25s}
.modal .card{position:relative;padding:calc(24px*var(--u)) calc(28px*var(--u));max-width:min(calc(620px*var(--u)),92vw);max-height:86vh;overflow:auto;text-align:center;animation:cardin .4s cubic-bezier(.2,.9,.3,1.25)}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.94)}}
.modal h2{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 .5em;display:flex;align-items:center;justify-content:center;gap:.4em;font-size:1.55em;color:var(--wood2);text-shadow:0 1px 0 #fff}
.modal p{font-weight:800;line-height:1.45;color:#4a3a2a}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1.1em}
.modal .pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}
.modal .page{background:linear-gradient(180deg,#fffdf8,#fbf3df);border:calc(2px*var(--u)) solid #e3d3b5;border-radius:16px;padding:.7em .9em;box-shadow:0 6px 14px rgba(0,0,0,.12),inset 0 1px 0 #fff;transition:transform .2s,box-shadow .2s}
.modal .page:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.16)}
.modal .page b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--blue2)}
.modal .page p{margin:.2em 0 0;font-size:.85em}
.modal .stars{display:flex;justify-content:center;gap:.25em;font-size:3em;color:var(--gold);margin:.1em 0 .2em}
.modal .stars .ic{fill:var(--gold);stroke:#b07a14;stroke-width:1.2;filter:drop-shadow(0 4px 10px rgba(242,193,78,.6));animation:starpop .5s cubic-bezier(.2,1.4,.4,1) both}
.modal .stars .ic:nth-child(1){animation-delay:.05s}.modal .stars .ic:nth-child(2){animation-delay:.2s}.modal .stars .ic:nth-child(3){animation-delay:.35s}
.modal .stars .ic.off{fill:#ddd0b8;stroke:#b9a684;filter:none;animation:none}
@keyframes starpop{0%{opacity:0;transform:scale(0) rotate(-35deg)}60%{opacity:1;transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fin{from{opacity:0}}

/* magnifier */
.magpanel{position:absolute;right:calc(20px*var(--u));top:calc(90px*var(--u));display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none}
.magpanel.on{opacity:1;transform:none}
.magpanel .lens{position:relative;width:calc(210px*var(--u));height:calc(210px*var(--u))}
.magpanel canvas{width:100%;height:100%;border-radius:50%;display:block}
.magpanel .ring{position:absolute;inset:calc(-9px*var(--u));border-radius:50%;border:calc(12px*var(--u)) solid #b8893c;box-shadow:inset 0 0 0 3px #7a5420,0 0 0 3px #7a5420,0 10px 26px rgba(0,0,0,.45),inset 0 10px 22px rgba(255,255,255,.4),inset 0 calc(-8px*var(--u)) calc(14px*var(--u)) rgba(90,55,20,.5)}
.magpanel .handle{position:absolute;right:calc(-34px*var(--u));bottom:calc(-34px*var(--u));width:calc(70px*var(--u));height:calc(22px*var(--u));background:linear-gradient(180deg,#9a6636,#5a3720);border-radius:11px;transform:rotate(45deg);z-index:-1;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.magpanel .info{padding:.55em .95em;max-width:calc(270px*var(--u));text-align:center}
.magpanel small{font-weight:900;font-size:.62em;letter-spacing:.1em;color:#8a6a4a}
.magpanel b{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15em;color:var(--wood2)}
.magpanel p{margin:.15em 0 0;font-size:.78em;font-weight:800;line-height:1.35;color:#4a3a2a}

/* thermometer + meter */
.thermo{position:absolute;left:calc(20px*var(--u));top:calc(100px*var(--u));display:flex;flex-direction:column;align-items:center;padding:.65em .75em;gap:6px;opacity:0;transform:translateX(-30px);transition:all .4s}
.thermo.on{opacity:1;transform:none}
.thermo .tv{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.2em;color:var(--wood2)}
.thermo .tube{position:relative;width:calc(26px*var(--u));height:calc(190px*var(--u));border-radius:13px;background:linear-gradient(90deg,#f3f3f3,#fff 40%,#e6e6e6);border:calc(3px*var(--u)) solid var(--ink);display:flex;align-items:flex-end;overflow:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.15)}
.thermo .tube i{display:block;width:100%;height:20%;background:linear-gradient(180deg,#ff7a54,#d33a24);transition:height .25s;box-shadow:0 0 10px rgba(255,90,60,.6)}
.thermo .mark{position:absolute;left:0;right:0;top:0;border-top:calc(3px*var(--u)) dashed var(--blue)}
.thermo .bulb{width:calc(40px*var(--u));height:calc(40px*var(--u));border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff8a68,#d33a24);border:calc(3px*var(--u)) solid var(--ink);margin-top:-14px;box-shadow:0 0 12px rgba(255,80,50,.5)}
.thermo small{font-weight:900;font-size:.62em;color:#5c4a3a}
.thermo.boil .tv{color:#d33a24;animation:blink .6s infinite}
.meter{position:absolute;left:50%;top:calc(86px*var(--u));transform:translate(-50%,-20px);opacity:0;transition:all .4s;padding:.5em 1em;display:flex;align-items:center;gap:.7em}
.meter.on{opacity:1;transform:translate(-50%,0)}
.meter small{font-weight:900;font-size:.8em;color:var(--wood2)}
.meter .bar{width:calc(220px*var(--u));height:calc(14px*var(--u));border-radius:8px;background:#e1d2b6;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a3a,var(--aqua));transition:width .2s;box-shadow:0 0 10px rgba(80,200,255,.6)}

.fade{position:absolute;inset:0;opacity:0;transition:opacity .45s;pointer-events:none;background:#0b1018}
.fade.on{opacity:1}
.fps{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#0f0;font:12px monospace;padding:4px 6px;border-radius:4px}
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){
  #rotate{display:flex;position:fixed;inset:0;z-index:99;background:radial-gradient(120% 100% at 50% 20%,#3a2c1e,#2b2118);color:#fff8ea;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Fredoka,sans-serif;font-size:22px;text-align:center;padding:30px}
  #rotate svg{width:90px;height:90px;animation:rot 2s ease-in-out infinite}
}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (max-height:460px){.dialogue .portrait{width:78px;height:78px}.actions{bottom:118px}.magpanel .lens{width:150px;height:150px}.thermo .tube{height:120px}}
</style>
